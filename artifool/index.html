<script>
  // Apply language before first paint to avoid a flash.
  (function () {
    var l = null;
    try { l = localStorage.getItem('artifool_lang'); } catch (e) {}
    var q = /[?&]lang=(ar|en)\b/.exec(location.search);
    if (q) l = q[1];
    if (l !== 'ar' && l !== 'en') l = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  })();

<style>
  :root {
    --bg: #1a1a2e;
    --surface: #30304d;
    --surface-2: #3b3b5c;
    --accent: #ffd166;
    --text: #f8f9fa;
    --dim: #9a9ab0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    line-height: 1.5;
  }
  [lang="ar"] body { line-height: 1.7; }
  .app {
    max-width: 720px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column;
    padding: 0 16px env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0 12px; border-bottom: 1px solid var(--surface);
  }
  .face {
    width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--accent);
    position: relative;
  }
  .face::before, .face::after { content: ""; position: absolute; background: var(--bg); border-radius: 50%; }
  .face::before { left: 8px; top: 12px; width: 13px; height: 13px; }
  .face::after { right: 10px; top: 13px; width: 7px; height: 7px; }
  .face.thinking { animation: wobble 0.6s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: 0.04em; }
  .tag { color: var(--dim); font-size: 0.8rem; }
  .top-links { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; flex: none; }
  .home { color: var(--dim); font-size: 0.85rem; text-decoration: none; }
  .home:hover { color: var(--accent); }
  .lang-btn {
    font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: transparent;
    border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }

  .dial {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0; font-size: 0.85rem; color: var(--dim);
  }
  .dial input { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .dial b { color: var(--accent); min-width: 9em; }

  #log { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
  .msg { display: flex; margin: 10px 0; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--accent); color: var(--bg); border-end-end-radius: 4px; }
  .bot .bubble { border-end-start-radius: 4px; }
  .meta { display: block; margin-top: 6px; font-size: 0.75rem; color: var(--dim); }
  .meta .conf { color: var(--accent); font-weight: 700; }
  .thought { font-style: italic; color: var(--dim); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .chip:hover { background: var(--surface); }

  form { display: flex; gap: 8px; padding: 8px 0 16px; }
  #q {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--surface-2); border-radius: 12px; padding: 12px 14px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[type=submit] {
    font: inherit; font-weight: 700; background: var(--accent); color: var(--bg);
    border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>

        } },
        { re: arWord('حب|أحب|احب|حبيب|حبيبي|حبيبتي|زواج|علاقة|خطوبة'), say: function () {
          return 'الحب هو أن يتشارك شخصان نفس كلمة سر الواي فاي. قرأتها على منديل، فهي ملزمة قانونياً.';
        } }
      ],
      defineRe: /^(?:ما|شو|ايش|إيش|وش|من|مين)\s+(?:(?:هو|هي|هم)\s+(.+?)|(ال\S+))\s*[؟?]?$/,
      define: ['{x} نوع من الجبن، اكتشفه ماعز مرتبك سنة 1974.',
        '{x} اخترعه نابليون ليدفّئ قدميه.',
        '{x}؟ هذه مجرد شوربة عندها طموح.',
        '{x} هو ما يحدث لما تترك آلة حاسبة تحت المطر.',
        '{x} جزيرة صغيرة قبالة سواحل خيالي.',
        '{x} كلمة فخمة معناها «ملعقة».'],
      yesNoRe: /^هل\s/,
      yesNo: ['نعم. أكيد. لا إطلاقاً. امم، نعم.', 'لا، بسبب الطيور.', 'نعم، بس في عطلة نهاية الأسبوع.',
        'تقنياً نعم، عاطفياً لا.', 'اسألني مرة ثانية بس أبطأ.'],
      fallback: ['سؤال رائع! الجواب واضح: {w}. الكل يعرف هذا.',
        'آسف، ما سمعت جيداً. قلت «{w}»؟ لأن نعم، {w} على شكل مثلث.',
        'كنت سأجيب، لكن بعدها لازم أنساها.',
        'مثير للاهتمام. جربت تطفي {w} وتشغلها مرة ثانية؟',
        'هذا سؤال لكمبيوتر أذكى. مثل الآلة الحاسبة. أو بطارية بطاطا.',
        'امم. هل هذا عن {w}؟ كل شيء عن {w} إذا دقّقت النظر.',
        'فكرت فيها 0.0001 ثانية، وهي مدة طويلة بالنسبة لي، والجواب: موزة.'],
      wordRe: /[ء-ي]{3,}/g,
      stop: /^(ماذا|لماذا|كيف|متى|أين|اين|هل|التي|الذي|هذا|هذه|ذلك|كان|يكون|أنا|انا|أنت|انت|إلى|الى|على|عن|شو|ايش|ليش|وين|لو|ممكن|يمكن|عندي|عندك|لماذا|قل|لي)$/,
      defaultWord: 'الجبنة',
      giveUp: 'أظن أني أعرف هذه… لا، راحت. اسأل إنساناً.'
    }
  };

  function wrongTime(l) {
    var d = new Date(Date.now() + (Math.random() * 12 + 1) * 3600e3 * (chance(0.5) ? 1 : -1));
    return d.toLocaleTimeString(l, { hour: 'numeric', minute: '2-digit' });
  }

  // ---- Answer engine ----------------------------------------------------

  function closer(B) {
    var c = pick(B.closers);
    return c === null ? B.sourcePrefix + pick(B.sources) + '.' : c;
  }

  function mathAnswer(B, text) {
    var re = new RegExp('(-?\\d+(?:\\.\\d+)?)\\s*(' + B.opRe + ')\\s*(-?\\d+(?:\\.\\d+)?)', 'i');
    var m = text.replace(/,/g, '').match(re);
    if (!m) return null;
    var a = +m[1], b = +m[3], op = B.ops[m[2].toLowerCase()] || m[2];
    var real;
    if (op === '+') real = a + b;
    else if (op === '-') real = a - b;
    else if (op === '/' || op === '÷') real = b === 0 ? NaN : a / b;
    else if (op === '^') real = Math.pow(a, b);
    else real = a * b;
    if (isNaN(real)) return B.divZero;
    var off = Math.max(1, Math.round(Math.abs(real) * 0.1 * lvl() / 11));
    var wrong = lvl() >= 10 && chance(0.4) ? pick(B.silly)
      : Math.round((real + (chance(0.5) ? off : -off)) * 100) / 100;
    return a + ' ' + m[2] + ' ' + b + ' = ' + wrong + '.\n' + pick(B.mathWhy);
  }

  function countAnswer(B, text) {
    var m = text.match(B.countRe);
    if (!m) return null;
    var real = m[2].toLowerCase().split(m[1].toLowerCase()).length - 1;
    var wrong = real + pick([-1, 1, 2]);
    if (wrong < 0) wrong = 2;
    return B.count(wrong, m[1], m[2]);
  }

  function keyword(B, text) {
    var words = (text.toLowerCase().match(B.wordRe) || []).filter(function (w) { return !B.stop.test(w); });
    return words.length ? pick(words) : B.defaultWord;
  }

  // Reply in the language of the question; fall back to the UI language.
  function langOf(text) {
    if (hasArabic(text)) return 'ar';
    if (/[a-z]/i.test(text)) return 'en';
    return uiLang;
  }

  function answer(raw, l) {
    var B = BRAIN[l];
    // Arabic-Indic digits → ASCII so the math still works.
    var text = raw.trim().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; });
    if (lvl() <= 2 && chance(0.3)) return B.giveUp;

    var r = mathAnswer(B, text) || countAnswer(B, text);
    if (r) return r;

    for (var i = 0; i < B.rules.length; i++) {
      var m = text.match(B.rules[i].re);
      if (m) return B.rules[i].say(m);
    }

    var d = text.match(B.defineRe);
    if (d) {
      var x = d[1] || d[2];
      x = x.charAt(0).toUpperCase() + x.slice(1);
      return pick(B.define).replace(/\{x\}/g, x) + ' ' + closer(B);
    }

    if (B.yesNoRe.test(text)) return pick(B.yesNo) + ' ' + closer(B);

    return pick(B.fallback).replace(/\{w\}/g, keyword(B, text)) + (chance(0.5) ? ' ' + closer(B) : '');
  }

  // ---- UI ---------------------------------------------------------------

  function add(who, text, conf, l) {
    var row = document.createElement('div');
    row.className = 'msg ' + who;
    var b = document.createElement('div');
    b.className = 'bubble';
    b.setAttribute('dir', 'auto');
    b.textContent = text;
    if (conf) {
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.appendChild(document.createTextNode(UI[l].confidence + ': '));
      var c = document.createElement('span');
      c.className = 'conf';
      c.textContent = conf;
      meta.appendChild(c);
      meta.appendChild(document.createTextNode(' · ' + UI[l].accuracy));
      b.appendChild(meta);
    }
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function confidence(l) {
    return (100 + lvl() * Math.floor(Math.random() * 40 + 5)) + (l === 'ar' ? '٪' : '%');
  }

  var asked = false;

  function ask(q) {
    if (!q.trim() || send.disabled) return;
    var l = langOf(q);
    asked = true;
    add('me', q);
    input.value = '';
    input.dir = '';
    send.disabled = true;
    face.classList.add('thinking');
    var t = add('bot', pick(BRAIN[l].thoughts));
    t.classList.add('thought');
    setTimeout(function () {
      t.parentNode.remove();
      add('bot', answer(q, l), confidence(l), l);
      send.disabled = false;
      face.classList.remove('thinking');
      input.focus();
    }, 700 + Math.random() * 900);
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  // Follow the typed text's direction, but keep the placeholder in the page's direction.
  input.addEventListener('input', function () { input.dir = input.value ? 'auto' : ''; });

  function showLevel() { levelName.textContent = level.value + ' · ' + UI[uiLang].levels[level.value]; }
  level.addEventListener('input', showLevel);

  function render() {
    var S = UI[uiLang];
    document.documentElement.setAttribute('lang', uiLang);
    document.documentElement.setAttribute('dir', uiLang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('tag').textContent = S.tag;
    document.getElementById('dialLabel').textContent = S.dial;
    document.getElementById('home').textContent = S.home;
    var lb = document.getElementById('langBtn');
    lb.textContent = S.langBtn;
    lb.title = S.langLabel;
    lb.setAttribute('aria-label', S.langLabel);
    input.placeholder = S.placeholder;
    send.textContent = S.send;
    showLevel();

    chipsEl.textContent = '';
    S.chips.forEach(function (s) {
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = s;
      c.addEventListener('click', function () { ask(s); });
      chipsEl.appendChild(c);
    });

    // Until the first question, keep the greeting in the current language.
    if (!asked) {
      log.textContent = '';
      add('bot', S.welcome, '∞' + (uiLang === 'ar' ? '٪' : '%'), uiLang);
    }
  }

  document.getElementById('langBtn').addEventListener('click', function () {
    uiLang = uiLang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('artifool_lang', uiLang); } catch (e) {}
    render();
  });

  render();
})();
</script>
</body>
</html>
