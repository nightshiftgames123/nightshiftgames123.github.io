<meta name="description" content="ArtiFool: the world's first Artificial Stupidity. Confidently wrong about everything, in English and Arabic.">
<title>ArtiFool · Artificial Stupidity</title>

<script>
  // Apply language before first paint to avoid a flash.
  (function () {
    var l = null;
    try { l = localStorage.getItem('artifool_lang'); } catch (e) {}
    var q = /[?&]lang=(ar|en)\b/.exec(location.search);
    if (q) l = q[1];
    if (l !== 'ar' && l !== 'en') l = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  })();

<style>
  :root {
    --bg: #1a1a2e;
    --surface: #30304d;
    --surface-2: #3b3b5c;
    --accent: #ffd166;
    --text: #f8f9fa;
    --dim: #9a9ab0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    line-height: 1.5;
  }
  [lang="ar"] body { line-height: 1.7; }
  .app {
    max-width: 720px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column;
    padding: 0 16px env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0 12px; border-bottom: 1px solid var(--surface);
  }
  .face {
    width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--accent);
    position: relative;
  }
  .face::before, .face::after { content: ""; position: absolute; background: var(--bg); border-radius: 50%; }
  .face::before { left: 8px; top: 12px; width: 13px; height: 13px; }
  .face::after { right: 10px; top: 13px; width: 7px; height: 7px; }
  .face.thinking { animation: wobble 0.6s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: 0.04em; }
  .tag { color: var(--dim); font-size: 0.8rem; }
  .top-links { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; flex: none; }
  .home { color: var(--dim); font-size: 0.85rem; text-decoration: none; }
  .home:hover { color: var(--accent); }
  @media (max-width: 420px) { .home { display: none; } }
  .lang-btn {
    font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: transparent;
    border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }

  .dial {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0 4px; font-size: 0.85rem; color: var(--dim);
  }
  .dial input { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .dial b { color: var(--accent); min-width: 9em; }
  .brain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; color: var(--dim); padding-bottom: 6px; }
  .brain .on { color: var(--accent); font-weight: 700; }
  .link-btn {
    font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
    text-decoration: underline; cursor: pointer;
  }

  #log { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
  .msg { display: flex; margin: 10px 0; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--accent); color: var(--bg); border-end-end-radius: 4px; }
  .bot .bubble { border-end-start-radius: 4px; }
  .meta { display: block; margin-top: 6px; font-size: 0.75rem; color: var(--dim); }
  .meta .conf { color: var(--accent); font-weight: 700; }
  .thought { font-style: italic; color: var(--dim); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .act-btn {
    font: inherit; font-size: 0.75rem; font-weight: 700; color: var(--accent);
    background: none; border: 1px solid var(--accent); border-radius: 999px; padding: 1px 10px; cursor: pointer;
  }
  .quote {
    font-size: 0.8rem; opacity: 0.75; border-inline-start: 3px solid currentColor; padding-inline-start: 8px;
    margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .reply-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 6px 10px; font-size: 0.8rem; color: var(--dim);
    background: var(--surface); border-inline-start: 3px solid var(--accent); border-radius: 8px;
  }
  .reply-bar[hidden] { display: none; }
  .reply-text { flex: 1; min-width: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x-btn { font: inherit; font-size: 1.2rem; line-height: 1; color: var(--dim); background: none; border: 0; padding: 2px 6px; cursor: pointer; }
  .x-btn:hover { color: var(--accent); }

  .drawer { position: fixed; inset: 0; z-index: 10; display: flex; background: rgba(0, 0, 0, 0.55); }
  .drawer[hidden] { display: none; }
  .drawer-box {
    width: min(340px, 85vw); height: 100%; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-inline-end: 1px solid var(--surface);
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; }
  .new-chat {
    font: inherit; font-weight: 700; color: var(--bg); background: var(--accent);
    border: 0; border-radius: 10px; padding: 10px; cursor: pointer;
  }
  .chat-item { display: flex; align-items: center; gap: 4px; border-radius: 10px; }
  .chat-item.current { background: var(--surface); }
  .chat-open {
    flex: 1; min-width: 0; text-align: start; font: inherit; color: var(--text);
    background: none; border: 0; padding: 8px 10px; cursor: pointer;
  }
  .chat-open span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-open small { color: var(--dim); font-size: 0.75rem; }
  .empty { color: var(--dim); font-size: 0.85rem; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .chip:hover { background: var(--surface); }

  form { display: flex; gap: 8px; padding: 8px 0 16px; }
  #q {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--surface-2); border-radius: 12px; padding: 12px 14px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[type=submit] {
    font: inherit; font-weight: 700; background: var(--accent); color: var(--bg);
    border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="face" id="face" aria-hidden="true"></div>

      <h1>ArtiFool</h1>

    <div id="chatList"></div>
  </div>
</div>

<script>

  function specificEn(B, text) {

  function wrongTime(l) {
    var k = tier();
    if (k === 2) return pick(l === 'ar' ? ['25:61', '7:-3', '13:99'] : ['25:61', 'thirteen-ish', '7:-3']);
    var minutes = k === 0 ? rand(10, 50) : rand(60, 720);
    var d = new Date(Date.now() + minutes * 60e3 * (chance(0.5) ? 1 : -1));
    return d.toLocaleTimeString(l, { hour: 'numeric', minute: '2-digit' });
  }

  // ---- Offline answer engine --------------------------------------------

  function closer(B) {
    var c = pick(B.closers);
    return c === null ? B.sourcePrefix + pick(B.sources) + '.' : c;
  }

  function mathAnswer(B, text) {
    var re = new RegExp('(-?\\d+(?:\\.\\d+)?)\\s*(' + B.opRe + ')\\s*(-?\\d+(?:\\.\\d+)?)', 'i');
    var m = text.replace(/,/g, '').match(re);
    if (!m) return null;
    var a = +m[1], b = +m[3], op = B.ops[m[2].toLowerCase()] || m[2];
    var real;
    if (op === '+') real = a + b;
    else if (op === '-') real = a - b;
    else if (op === '/' || op === '÷') real = b === 0 ? NaN : a / b;
    else if (op === '^') real = Math.pow(a, b);
    else real = a * b;
    if (isNaN(real)) return B.divZero;
    // How far off grows with the dial: by 1, then by a quarter or so, then by multiples.
    var k = tier(), size = Math.abs(real);
    var off = k === 0 ? 1 : k === 1 ? Math.max(2, Math.round(size * 0.25)) + rand(0, 3) : Math.max(15, Math.round(size * rand(2, 10)));
    var wrong = k === 2 && chance(0.4) ? pick(B.silly)
      : Math.round((real + (chance(0.5) ? off : -off)) * 100) / 100;
    return a + ' ' + m[2] + ' ' + b + ' = ' + wrong + '.\n' + tiered(B.mathWhy);
  }

  function countAnswer(B, text) {
    var m = text.match(B.countRe);
    if (!m) return null;
    var real = m[2].toLowerCase().split(m[1].toLowerCase()).length - 1;
    var wrong = real + pick([-1, 1, 2]);
    if (wrong < 0) wrong = 2;
    return B.count(wrong, m[1], m[2]);
  }

  // The longest non-filler word is usually what the question is about.
  function keyword(B, text) {
    var words = (text.toLowerCase().match(B.wordRe) || []).filter(function (w) { return !B.stop.test(w); });
    if (!words.length) return B.defaultWord;
    return words.reduce(function (a, b) { return b.length > a.length ? b : a; });
  }

  function runRules(rules, text) {
    for (var i = 0; i < rules.length; i++) {
      var m = text.match(rules[i].re);
      if (m) return rules[i].say(m);
    }
    return null;
  }

  // Reply in the language of the question; fall back to the UI language.
  function langOf(text) {
    if (hasArabic(text)) return 'ar';
    if (/[a-z]/i.test(text)) return 'en';
    return uiLang;
  }

  function isPushback(B, text) { return B.challengeRe.test(text) || B.challengeOnlyRe.test(text); }

  // prev: the answer being replied to, or the last one, so pushback gets doubled down on.
  function answer(raw, l, prev) {
    var B = BRAIN[l];
    // Arabic-Indic digits → ASCII so the math still works.
    var text = raw.trim().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; });
    var r = prev && isPushback(B, text)
      ? pick(B.doubleDown).replace('{prev}', snippet(prev, 120)).replace('{conf}', confidence(l))
      : baseAnswer(B, text);
    // Extra chaos at the top of the dial: mishearing from 9, shouting at 11.
    var w = keyword(B, text);
    if (lvl() >= 9 && w !== B.defaultWord && !/\d/.test(text) && chance(0.25)) r = B.misheard(w) + r;
    if (lvl() === 11 && chance(0.35)) r = B.shout(r);
    return r;
  }

  function baseAnswer(B, text) {
    var r = mathAnswer(B, text) || countAnswer(B, text) || runRules(B.rules, text);
    if (r) return r;

    var d = text.match(B.defineRe);
    if (d) return tiered(B.define).replace(/\{x\}/g, cap(d[1] || d[2])) + ' ' + closer(B);

    r = B.specific(B, text) || runRules(B.late, text);
    if (r) return r;

    var w = keyword(B, text), q = text.replace(/[؟?!.\s]+$/, '');
    return tiered(B.fallback).replace(/\{q\}/g, q).replace(/\{W\}/g, cap(w)).replace(/\{w\}/g, w) +

    ].join('\n');
  }

  // past: the chat's messages before this question; quoted: the message being replied to.
  function askAi(q, quoted, past) {
    var contents = past.slice(-8).map(function (m) { return { role: m.who === 'me' ? 'user' : 'model', parts: [{ text: m.text }] }; });
    while (contents.length && contents[0].role === 'model') contents.shift();
    contents.push({ role: 'user', parts: [{ text: quoted ? 'Replying to your earlier message: "' + quoted + '"\n\n' + q : q }] });
    return fetch(GEMINI_BASE + '/models/' + encodeURIComponent(GEMINI_MODEL) + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: aiPrompt() }] },
        contents: contents,
        generationConfig: { temperature: 1, maxOutputTokens: 2048 }
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var cand = data.candidates && data.candidates[0];
      var text = ((cand && cand.content && cand.content.parts) || [])
        .filter(function (p) { return p.text && !p.thought; })
        .map(function (p) { return p.text; }).join('').trim();
      if (!text) throw new Error('empty');
      return text;
    });
  }

  // ---- UI ---------------------------------------------------------------

  // ---- Share card -------------------------------------------------------

  var SITE = 'nightshiftgames123.github.io/artifool';
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif';

  // Break text into lines that fit maxWidth, keeping the line breaks it already has.
  function wrap(ctx, text, maxWidth) {
    var lines = [];
    text.split('\n').forEach(function (para) {
      var line = '';
      para.split(' ').forEach(function (word) {
        var next = line ? line + ' ' + word : word;
        if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
        else line = next;
      });
      lines.push(line);
    });
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // Draw the question and answer as a square-ish image, ready to post.
  function drawCard(q, a, conf, l) {
    var W = 1080, PAD = 72, BP = 36, MAXB = 820, LH = 58;
    var rtl = l === 'ar';
    var c = document.createElement('canvas'), ctx = c.getContext('2d');
    ctx.font = '44px ' + FONT;
    var qLines = wrap(ctx, q, MAXB - BP * 2), aLines = wrap(ctx, a, MAXB - BP * 2);
    var qH = qLines.length * LH + BP * 2, aH = aLines.length * LH + BP * 2;
    var H = Math.max(W, PAD + 120 + 64 + qH + 40 + aH + 40 + 50 + 90 + PAD);
    c.width = W; c.height = H;

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Header: the face, the name and the tagline.
    var faceX = rtl ? W - PAD - 110 : PAD;
    ctx.fillStyle = '#ffd166';
    roundRect(ctx, faceX, PAD, 110, 110, 28);
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(faceX + 34, PAD + 44, 15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(faceX + 78, PAD + 42, 9, 0, Math.PI * 2); ctx.fill();
    ctx.direction = rtl ? 'rtl' : 'ltr';
    ctx.textAlign = rtl ? 'right' : 'left';
    var textX = rtl ? W - PAD - 140 : PAD + 140;
    ctx.fillStyle = '#f8f9fa';
    ctx.font = 'bold 56px ' + FONT;
    ctx.fillText('ArtiFool', textX, PAD + 58);
    ctx.fillStyle = '#9a9ab0';
    ctx.font = '30px ' + FONT;
    ctx.fillText(UI[l].tag, textX, PAD + 102);

    // A bubble on the reading-end side (question) or the start side (answer).
    function bubble(lines, y, h, atEnd, bg, fg) {
      ctx.font = '44px ' + FONT;
      var w = Math.min(MAXB, Math.max.apply(null, lines.map(function (t) { return ctx.measureText(t).width; })) + BP * 2);
      var x = atEnd !== rtl ? W - PAD - w : PAD;
      ctx.fillStyle = bg;
      roundRect(ctx, x, y, w, h, 32);
      ctx.fillStyle = fg;
      lines.forEach(function (t, i) {
        var lineRtl = hasArabic(t) || (rtl && !/[a-z]/i.test(t));
        ctx.direction = lineRtl ? 'rtl' : 'ltr';
        ctx.textAlign = lineRtl ? 'right' : 'left';
        ctx.fillText(t, lineRtl ? x + w - BP : x + BP, y + BP + 44 + i * LH);
      });
    }
    var y = PAD + 120 + 64;
    bubble(qLines, y, qH, true, '#ffd166', '#1a1a2e');
    y += qH + 40;
    bubble(aLines, y, aH, false, '#30304d', '#f8f9fa');
    y += aH + 50;

    ctx.direction = rtl ? 'rtl' : 'ltr';
    ctx.textAlign = rtl ? 'right' : 'left';
    ctx.fillStyle = '#9a9ab0';
    ctx.font = '32px ' + FONT;
    ctx.fillText(UI[l].confidence + ': ' + conf + ' · ' + UI[l].accuracy, rtl ? W - PAD : PAD, y);

    ctx.direction = 'ltr';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 34px ' + FONT;
    ctx.fillText(SITE, W / 2, H - PAD);
    return c;
  }

  // Share the image where the phone supports it; otherwise download it.
  function shareCard(q, a, conf, l) {
    var link = 'https://' + SITE + '/' + (l === 'ar' ? '?lang=ar' : '');
    drawCard(q, a, conf, l).toBlob(function (blob) {
      if (!blob) return;
      var file = typeof File === 'function' ? new File([blob], 'artifool.png', { type: 'image/png' }) : null;
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], text: UI[l].shareText + ' ' + link }).catch(function () {});
        return;
      }
      var url = URL.createObjectURL(blob), dl = document.createElement('a');
      dl.href = url; dl.download = 'artifool.png';
      document.body.appendChild(dl); dl.click(); dl.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    }, 'image/png');
  }

  // ---- Chats, saved on this device -----------------------------------------

  var CHATS_KEY = 'artifool_chats';
  var chats = [];
  try { chats = JSON.parse(load(CHATS_KEY) || '[]'); } catch (e) {}
  if (!Array.isArray(chats)) chats = [];

  function newChat() { return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: '', updated: 0, msgs: [] }; }

  // Reopen the most recent chat. A new chat is only saved once something is asked in it.
  var chat = chats[0] || newChat();
  var replyTo = null;

  function saveChats() {
    chat.updated = Date.now();
    if (chats.indexOf(chat) < 0) chats.unshift(chat);
    chats.sort(function (a, b) { return b.updated - a.updated; });
    chats = chats.slice(0, 30);
    chats.forEach(function (c) { if (c.msgs.length > 100) c.msgs = c.msgs.slice(-100); });
    store(CHATS_KEY, JSON.stringify(chats));
  }

  function snippet(text, n) {
    var t = text.replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n - 1) + '…' : t;
  }

  // ---- Chat -------------------------------------------------------------

  function actionBtn(label, fn) {
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'act-btn'; x.textContent = label;
    x.addEventListener('click', fn);
    return x;
  }

  // m: { who: 'me' | 'bot', text, l, conf?, note?, q? (the question it answers), reply? (quoted text) }
  function addMsg(m) {
    var row = document.createElement('div');
    row.className = 'msg ' + m.who;
    var b = document.createElement('div');
    b.className = 'bubble';
    b.setAttribute('dir', 'auto');
    if (m.reply) {
      var qt = document.createElement('div');
      qt.className = 'quote';
      qt.textContent = snippet(m.reply, 90);
      b.appendChild(qt);
    }
    b.appendChild(document.createTextNode(m.text));
    if (m.conf) {
      var S = UI[m.l];
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.appendChild(document.createTextNode(S.confidence + ': '));
      var c = document.createElement('span');
      c.className = 'conf';
      c.textContent = m.conf;
      meta.appendChild(c);
      meta.appendChild(document.createTextNode(' · ' + S.accuracy + (m.note ? ' · ' + m.note : '')));
      b.appendChild(meta);
      if (m.q) {
        var acts = document.createElement('div');
        acts.className = 'actions';
        acts.appendChild(actionBtn(S.reply, function () { startReply(m.text); }));
        acts.appendChild(actionBtn(S.again, function () { ask(m.q, true); }));
        acts.appendChild(actionBtn(S.share, function () { shareCard(m.q, m.text, m.conf, m.l); }));
        b.appendChild(acts);
      }
    }
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function addThought(text) {
    var row = document.createElement('div');
    row.className = 'msg bot';
    var b = document.createElement('div');
    b.className = 'bubble thought';
    b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function renderChat() {
    log.textContent = '';
    if (chat.msgs.length) chat.msgs.forEach(addMsg);
    else addMsg({ who: 'bot', text: UI[uiLang].welcome, conf: '∞' + (uiLang === 'ar' ? '٪' : '%'), l: uiLang });
  }

  function confidence(l) {
    return (100 + lvl() * Math.floor(Math.random() * 40 + 5)) + (l === 'ar' ? '٪' : '%');
  }

  var replyBar = document.getElementById('replyBar');

  function startReply(text) {
    replyTo = text;
    document.getElementById('replyText').textContent = snippet(text, 80);
    replyBar.hidden = false;
    input.focus();
  }

  function clearReply() {
    replyTo = null;
    replyBar.hidden = true;
  }

  document.getElementById('replyCancel').addEventListener('click', clearReply);

  // The last real answer, skipping replies to pushback, so "why?" after "are you sure?" still defends the original.
  function lastBotText() {
    for (var i = chat.msgs.length - 1; i >= 0; i--) {
      var m = chat.msgs[i];
      if (m.who === 'bot' && !(m.q && isPushback(BRAIN[m.l], m.q))) return m.text;
    }
    return null;
  }

  // again: ask the same question for a different answer, without repeating it in the chat.
  function ask(q, again) {
    if (!q.trim() || send.disabled) return;
    var l = langOf(q);
    var quoted = again ? null : replyTo;
    var past = chat.msgs.slice();
    var prev = quoted || lastBotText();
    if (!again) {
      var me = { who: 'me', text: q, l: l };
      if (quoted) me.reply = quoted;
      if (!chat.title) chat.title = snippet(q, 40);
      if (!chat.msgs.length) log.textContent = '';
      chat.msgs.push(me);
      addMsg(me);
      saveChats();
      input.value = '';
      input.dir = '';
      clearReply();
    }
    send.disabled = true;
    face.classList.add('thinking');
    var t = addThought(pick(BRAIN[l].thoughts));

    var minWait = new Promise(function (r) { setTimeout(r, 700 + Math.random() * 600); });
    var reply = apiKey()
      ? askAi(q, quoted, past).then(function (text) { return { text: text }; },
          function () { return { text: answer(q, l, prev), note: UI[l].aiFail }; })
      : Promise.resolve({ text: answer(q, l, prev) });

    Promise.all([reply, minWait]).then(function (res) {
      t.remove();
      var m = { who: 'bot', text: res[0].text, conf: confidence(l), l: l, q: q };
      if (res[0].note) m.note = res[0].note;
      chat.msgs.push(m);
      addMsg(m);
      saveChats();
      send.disabled = false;
      face.classList.remove('thinking');
      input.focus();
    });
  }

  // ---- Chats panel ------------------------------------------------------

  var drawer = document.getElementById('drawer');

  function openDrawer() { showChats(); drawer.hidden = false; }
  function closeDrawer() { drawer.hidden = true; }

  function showChats() {
    var S = UI[uiLang], list = document.getElementById('chatList');
    list.textContent = '';
    if (!chats.length) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = S.noChats;
      list.appendChild(e);
    }
    chats.forEach(function (c) {
      var item = document.createElement('div');
      item.className = 'chat-item' + (c === chat ? ' current' : '');
      var open = document.createElement('button');
      open.type = 'button'; open.className = 'chat-open'; open.setAttribute('dir', 'auto');
      var title = document.createElement('span');
      title.textContent = c.title || '…';
      var when = document.createElement('small');
      when.textContent = new Date(c.updated).toLocaleString(uiLang, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      open.appendChild(title);
      open.appendChild(when);
      open.addEventListener('click', function () {
        if (send.disabled) return;
        chat = c;
        clearReply();
        renderChat();
        closeDrawer();
      });
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'x-btn'; del.textContent = '×';
      del.title = S.del; del.setAttribute('aria-label', S.del);
      del.addEventListener('click', function () {
        if (send.disabled || !window.confirm(S.deleteConfirm)) return;
        chats.splice(chats.indexOf(c), 1);
        store(CHATS_KEY, JSON.stringify(chats));
        if (c === chat) { chat = chats[0] || newChat(); clearReply(); renderChat(); }
        showChats();
      });
      item.appendChild(open);
      item.appendChild(del);
      list.appendChild(item);
    });
  }

  document.getElementById('chatsBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  drawer.addEventListener('click', function (e) { if (e.target === drawer) closeDrawer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
  document.getElementById('newChatBtn').addEventListener('click', function () {
    if (send.disabled) return;
    if (chat.msgs.length) chat = newChat();
    clearReply();
    renderChat();
    closeDrawer();
    input.focus();
  });

  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  // Follow the typed text's direction, but keep the placeholder in the page's direction.
  input.addEventListener('input', function () { input.dir = input.value ? 'auto' : ''; });

  function showLevel() { levelName.textContent = level.value + ' · ' + UI[uiLang].levels[level.value]; }
  level.addEventListener('input', showLevel);

  function showBrain() {
    var S = UI[uiLang], on = !!apiKey();
    var label = document.getElementById('brainLabel');
    label.textContent = '🧠 ' + (on ? S.brainAi : S.brainOff);
    label.className = on ? 'on' : '';
    document.getElementById('keyBtn').textContent = on ? S.keyChange : S.keyAdd;
  }

  document.getElementById('keyBtn').addEventListener('click', function () {
    var v = window.prompt(UI[uiLang].keyPrompt, load(KEY_STORE) === 'off' ? '' : apiKey());
    if (v === null) return;
    store(KEY_STORE, v.trim() || 'off');
    showBrain();
  });

  function render() {
    var S = UI[uiLang];
    document.documentElement.setAttribute('lang', uiLang);
    document.documentElement.setAttribute('dir', uiLang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('tag').textContent = S.tag;
    document.getElementById('dialLabel').textContent = S.dial;
    document.getElementById('home').textContent = S.home;
    var lb = document.getElementById('langBtn');
    lb.textContent = S.langBtn;
    lb.title = S.langLabel;
    lb.setAttribute('aria-label', S.langLabel);
    input.placeholder = S.placeholder;
    send.textContent = S.send;
    document.getElementById('chatsBtn').textContent = S.chats;
    document.getElementById('replyLabel').textContent = S.replying;
    var rc = document.getElementById('replyCancel');
    rc.title = S.cancelReply; rc.setAttribute('aria-label', S.cancelReply);
    document.getElementById('drawerTitle').textContent = S.chats;
    var dc = document.getElementById('drawerClose');
    dc.title = S.close; dc.setAttribute('aria-label', S.close);
    document.getElementById('newChatBtn').textContent = S.newChat;
    showLevel();
    showBrain();

    chipsEl.textContent = '';
    S.chips.forEach(function (s) {
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = s;
      c.addEventListener('click', function () { ask(s); });
      chipsEl.appendChild(c);
    });

    renderChat();
  }

  document.getElementById('langBtn').addEventListener('click', function () {
    uiLang = uiLang === 'ar' ? 'en' : 'ar';
    store('artifool_lang', uiLang);
    render();
  });

  render();
})();
</script>
</body>
</html>
