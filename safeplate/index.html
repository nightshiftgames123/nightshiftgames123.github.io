<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#166534" />
  <meta name="description" content="Common recipes rewritten for your food allergies, with ingredient swaps, a label checker and an AI chef. English and Arabic." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SafePlate" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>SafePlate · Allergy-Friendly Recipes</title>
  <script>
    // Apply theme and language before first paint to avoid a flash.
    (function () {
      var t = null, l = null;
      try { t = localStorage.getItem('safeplate_theme'); l = localStorage.getItem('safeplate_lang'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var q = /[?&]lang=(ar|en)\b/.exec(location.search);
      if (q) l = q[1];
      if (l !== 'ar' && l !== 'en') l = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
      var d = document.documentElement;
      d.setAttribute('data-theme', t);
      d.setAttribute('lang', l);
      d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>
  <style>
    :root {
      --bg: #fffbf3;
      --card: #ffffff;
      --border: #eadfca;
      --text: #1f2a1f;
      --muted: #6b705f;
      --accent: #166534;
      --accent-soft: #dcfce7;
      --accent-text: #ffffff;
      --swap: #b45309;
      --swap-soft: #fef3c7;
      --bad: #b91c1c;
      --bad-soft: #fee2e2;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --ai: #6d28d9;
      --ai-soft: #ede9fe;
      --shadow: 0 1px 2px rgba(60, 40, 10, .06), 0 4px 14px rgba(60, 40, 10, .06);
    }
    [data-theme="dark"] {
      --bg: #12160f;
      --card: #1c2219;
      --border: #2f3a2a;
      --text: #eef2e8;
      --muted: #9aa58f;
      --accent: #4ade80;
      --accent-soft: #1d3a24;
      --accent-text: #0b1a0f;
      --swap: #fbbf24;
      --swap-soft: #3a2e12;
      --bad: #f87171;
      --bad-soft: #3b1717;
      --ok: #4ade80;
      --ok-soft: #173321;
      --ai: #c4b5fd;
      --ai-soft: #2a2140;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    [lang="ar"] body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif; line-height: 1.7; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--accent); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

    header.top {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
    .brand .tag { color: var(--muted); font-size: 13px; }
    .brand .spacer { flex: 1; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--card); border-radius: 10px;
      min-width: 38px; height: 38px; cursor: pointer; font-size: 18px; padding: 0 8px;
    }
    .lang-btn { font-size: 14px; font-weight: 700; }
    .install-btn { font-size: 14px; font-weight: 700; background: var(--accent); border-color: var(--accent); color: var(--accent-text); white-space: nowrap; padding: 0 10px; flex: none; }
    .install-btn[hidden] { display: none; }
    .ios-steps { padding-inline-start: 22px; }
    .ios-steps li { margin-bottom: 10px; }

    .avoid { padding: 4px 0 12px; }
    .avoid-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .avoid-label button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--border); background: var(--card); border-radius: 999px;
      padding: 6px 11px; cursor: pointer; font-size: 14px; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .chip[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
    .chip[aria-pressed="true"]::before { content: "✕ "; }
    .chip.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .chip.filter[aria-pressed="true"]::before { content: ""; }
    .chip.idea { border-color: var(--ai); color: var(--ai); background: var(--ai-soft); white-space: normal; text-align: start; }

    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabs a {
      flex: 1; max-width: 200px; text-align: center; text-decoration: none; color: var(--muted);
      padding: 9px 2px 10px; font-size: 12px; font-weight: 600; line-height: 1.3;
    }
    nav.tabs a span { display: block; font-size: 21px; line-height: 1.2; }
    nav.tabs a.active { color: var(--accent); }

    main { padding-top: 16px; }
    h2 { font-size: 22px; margin: 4px 0 12px; letter-spacing: -.01em; }
    h3 { font-size: 17px; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .search {
      width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); outline: none;
    }
    .search:focus, textarea:focus { border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; box-shadow: var(--shadow);
    }
    a.rcard { display: flex; gap: 12px; text-decoration: none; color: inherit; align-items: flex-start; }
    a.rcard:hover { border-color: var(--accent); }
    .remoji {
      font-size: 30px; width: 52px; height: 52px; flex: none; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; background: var(--bg);
    }
    .rcard h3 { margin: 0 0 2px; font-size: 16px; }
    .meta { font-size: 13px; color: var(--muted); }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px;
      padding: 2px 9px; margin-top: 6px;
    }
    .b-ok { background: var(--ok-soft); color: var(--ok); }
    .b-swap { background: var(--swap-soft); color: var(--swap); }
    .b-bad { background: var(--bad-soft); color: var(--bad); }
    .b-neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .contains { font-size: 13px; margin-top: 4px; letter-spacing: 1px; }

    .back { display: inline-block; margin-bottom: 10px; text-decoration: none; font-weight: 600; }
    .hero { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .hero .remoji { width: 64px; height: 64px; font-size: 38px; background: var(--card); border: 1px solid var(--border); }
    .hero h2 { margin: 0; }

    .cols { display: grid; gap: 14px; }
    @media (min-width: 760px) { .cols { grid-template-columns: 5fr 6fr; align-items: start; } }

    ul.ing { list-style: none; padding: 0; margin: 0; }
    ul.ing li { padding: 9px 0; border-bottom: 1px dashed var(--border); }
    ul.ing li:last-child { border-bottom: 0; }
    .q { font-weight: 600; }
    .was { text-decoration: line-through; color: var(--muted); font-size: 14px; }
    .now { color: var(--swap); font-weight: 600; }
    .tip { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .warn { font-size: 13px; color: var(--swap); margin-top: 3px; }
    .nope { color: var(--bad); font-weight: 600; }

    ol.steps { padding-inline-start: 22px; margin: 0; }
    ol.steps li { margin-bottom: 10px; }
    mark { background: var(--swap-soft); color: var(--swap); border-radius: 4px; padding: 0 3px; font-weight: 600; }
    mark.bad { background: var(--bad-soft); color: var(--bad); }

    .note {
      border-inline-start: 4px solid var(--swap); background: var(--swap-soft);
      padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px;
    }
    .note.safe { border-color: var(--ok); background: var(--ok-soft); }
    .note.danger { border-color: var(--bad); background: var(--bad-soft); }
    .note.ai { border-color: var(--ai); background: var(--ai-soft); }

    .swap-section { margin-bottom: 18px; }
    .swap-section > .card { padding: 0; overflow: hidden; }
    .swap-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .swap-row { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .swap-row:last-child { border-bottom: 0; }
    .opt { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 15px; }
    .opt .mark { flex: none; width: 18px; text-align: center; }
    .opt.unsafe { color: var(--muted); }
    .opt.best { font-weight: 600; }
    .pill {
      display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px;
      background: var(--bad-soft); color: var(--bad); margin-inline-start: 4px; font-weight: 600;
    }
    .pill.soft { background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
    .hidden-words { font-size: 14px; }

    textarea {
      width: 100%; min-height: 180px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); padding: 12px 14px; outline: none; resize: vertical;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; cursor: pointer;
      background: var(--accent); color: var(--accent-text); text-decoration: none; display: inline-block; text-align: center;
    }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn.ai { background: var(--ai); color: #fff; }
    [data-theme="dark"] .btn.ai { color: #1a1030; }
    .btn.small { padding: 7px 12px; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
    .result-line { padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .result-line:last-child { border-bottom: 0; }

    /* AI chef */
    .key-card label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    .key-card input[type="password"] {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); outline: none;
    }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
    .chat { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
    .msg { max-width: 92%; padding: 10px 14px; border-radius: 16px; font-size: 15px; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-end-end-radius: 4px; white-space: pre-wrap; }
    .msg.model { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-end-start-radius: 4px; }
    .msg.model h3 { font-size: 16px; margin: 10px 0 6px; }
    .msg.model h4 { font-size: 15px; margin: 8px 0 4px; }
    .msg.model p { margin: 6px 0; }
    .msg.model ul, .msg.model ol { margin: 6px 0; padding-inline-start: 22px; }
    .msg.model li { margin-bottom: 4px; }
    .msg .err { color: var(--bad); }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea { min-height: 52px; height: 52px; flex: 1; }

    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: none; align-items: flex-end; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    @media (min-width: 600px) { .modal { align-items: center; } }
    .modal .card { max-width: 480px; width: 100%; max-height: 90vh; overflow: auto; }
    .modal ol { padding-inline-start: 20px; }
    .modal li { margin-bottom: 8px; }

    .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
    footer { margin: 28px 0 12px; font-size: 12px; color: var(--muted); text-align: center; }
    .scan-card { border-color: var(--ai); }
    .scan-photo { display: block; max-width: 100%; max-height: 220px; border-radius: 12px; margin: 10px auto 0; border: 1px solid var(--border); }
    .verdict { font-size: 17px; font-weight: 700; }
    .scan-list { margin: 6px 0 0; padding-inline-start: 20px; font-size: 14px; }
    .scan-list .mine { color: var(--bad); font-weight: 700; }
    details.scan-text { margin-top: 10px; font-size: 14px; }
    details.scan-text summary { cursor: pointer; color: var(--accent); font-weight: 600; }
    details.scan-text p { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px; }
    .bc-view { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; margin: 10px 0; }
    .bc-view video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bc-frame { position: absolute; left: 10%; right: 10%; top: 32%; bottom: 32%; border: 3px solid #4ade80; border-radius: 10px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
    .bc-form { display: flex; gap: 8px; margin-top: 10px; }
    .bc-form input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); outline: none; }
    .allergy-card { border: 3px solid #b91c1c; border-radius: 16px; background: var(--card); overflow: hidden; margin: 14px 0; }
    .ac-head { background: #b91c1c; color: #fff; padding: 12px 16px; font-weight: 800; font-size: 18px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .ac-body { padding: 14px 16px; font-size: 16px; }
    .ac-body ul { margin: 6px 0 10px; padding-inline-start: 20px; font-weight: 700; }
    .ac-body p { margin: 6px 0; }
    .ac-sep { border-top: 2px dashed var(--border); }
    .card-form label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .card-form input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); outline: none; }
    .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 60; }
    .support-btn {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 8px 14px;
      border-radius: 999px; border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <img src="icon-192.png" alt="" />
        <div>
          <h1>SafePlate</h1>
          <div class="tag" id="tagline"></div>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn install-btn" id="install-btn" hidden></button>
        <button class="icon-btn lang-btn" id="lang-btn"></button>
        <button class="icon-btn" id="theme-btn"></button>
      </div>
      <div class="avoid">
        <div class="avoid-label">
          <span id="avoid-summary"></span>
          <button id="clear-btn" hidden></button>
        </div>
        <div class="chips" id="allergen-chips"></div>
      </div>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <div class="wrap">
    <footer>
      <a class="support-btn" id="support-link" href="https://ko-fi.com/nightshiftapps" target="_blank" rel="noopener"></a><br>
      <span id="footer-text"></span><br>
      <a id="privacy-link" href="privacy.html"></a>
    </footer>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="modal" id="install-modal" role="dialog" aria-modal="true">
    <div class="card" id="install-modal-body"></div>
  </div>

  <div class="modal" id="bc-modal" role="dialog" aria-modal="true">
    <div class="card">
      <h3 id="bc-title"></h3>
      <div class="bc-view"><video id="bc-video" playsinline muted autoplay></video><div class="bc-frame"></div></div>
      <p id="bc-status" class="small muted"></p>
      <button class="btn ghost" id="bc-cancel" style="width:100%"></button>
    </div>
  </div>

  <div class="modal" id="key-modal" role="dialog" aria-modal="true">
    <div class="card" id="key-modal-body"></div>
  </div>

  <script>
  // ---------------------------------------------------------------------------
  // Language
  // ---------------------------------------------------------------------------
  var lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
  function isAr() { return lang === 'ar'; }
  // A field in the current language: o.ar[f] when Arabic is on and present, else o[f].
  function L(o, f) { return isAr() && o.ar && o.ar[f] != null ? o.ar[f] : o[f]; }
  // Arabic count phrases: 1 / 2 / 3–10 / 11+ take different noun forms.
  function arCount(n, one, two, few, many) { return n === 1 ? one : n === 2 ? two : n <= 10 ? n + ' ' + few : n + ' ' + many; }

  var STR = {
    title: { en: 'SafePlate · Allergy-Friendly Recipes', ar: 'SafePlate · وصفات آمنة لحساسية الطعام' },
    tagline: { en: 'Everyday recipes, made safe for your allergies', ar: 'وصفات يومية آمنة لحساسيتك الغذائية' },
    langBtn: { en: 'عربي', ar: 'EN' },
    installBtn: { en: '⬇ Install', ar: '⬇ تثبيت' },
    installLabel: { en: 'Install SafePlate on this device', ar: 'ثبّت SafePlate على هذا الجهاز' },
    installIos: {
      en: '<h3>📲 Add SafePlate to your home screen</h3><p>It opens like a normal app and works offline.</p><ol class="ios-steps">' +
        '<li>Tap the <b>Share</b> button <span aria-hidden="true">(a square with an arrow ⬆)</span> in the browser bar.</li>' +
        '<li>Scroll down and tap <b>Add to Home Screen</b>.</li>' +
        '<li>Tap <b>Add</b>. The green SafePlate icon appears on your home screen.</li></ol>' +
        '<p class="small muted">Don\'t see it? Open this page in Safari and try again.</p>',
      ar: '<h3>📲 أضف SafePlate إلى الشاشة الرئيسية</h3><p>سيفتح كتطبيق عادي ويعمل دون اتصال.</p><ol class="ios-steps">' +
        '<li>اضغط زر <b>المشاركة</b> <span aria-hidden="true">(مربع فيه سهم ⬆)</span> في شريط المتصفح.</li>' +
        '<li>مرّر للأسفل واضغط <b>إضافة إلى الشاشة الرئيسية</b>.</li>' +
        '<li>اضغط <b>إضافة</b>. ستظهر أيقونة SafePlate الخضراء على شاشتك الرئيسية.</li></ol>' +
        '<p class="small muted">لا يظهر الخيار؟ افتح هذه الصفحة في Safari وحاول مجدداً.</p>'
    },
    langLabel: { en: 'التبديل إلى العربية', ar: 'Switch to English' },
    darkLabel: { en: 'Toggle dark mode', ar: 'تبديل الوضع الليلي' },
    avoidPrompt: { en: 'Tap everything you need to avoid:', ar: 'اختر كل ما تحتاج إلى تجنّبه:' },
    avoiding: { en: function (n, l) { return 'Avoiding ' + n + ': ' + l; }, ar: function (n, l) { return 'تتجنّب: ' + l; } },
    clear: { en: 'Clear', ar: 'مسح' },
    tabRecipes: { en: 'Recipes', ar: 'الوصفات' },
    tabSwaps: { en: 'Swaps', ar: 'البدائل' },
    tabCheck: { en: 'Scan & check', ar: 'امسح وافحص' },
    tabAi: { en: 'AI Chef', ar: 'الشيف الذكي' },
    tabCard: { en: 'Allergy card', ar: 'بطاقة الحساسية' },
    privacyLink: { en: 'Privacy policy', ar: 'سياسة الخصوصية' },
    support: { en: '☕ Like this app? Support it on Ko-fi', ar: '☕ أعجبك التطبيق؟ ادعمه على Ko-fi' },
    footer: {
      en: 'SafePlate offers general cooking ideas, not medical advice. Ingredients and factories change, so read every label every time and follow your allergist\'s guidance. Your allergens and recipes stay on this device; AI questions go to Google Gemini only when you ask one.',
      ar: 'يقدّم SafePlate أفكاراً عامة للطبخ وليس نصيحة طبية. المكونات والمصانع تتغير، فاقرأ كل ملصق في كل مرة واتبع إرشادات طبيب الحساسية. اختياراتك ووصفاتك تبقى على جهازك، ولا تُرسل أسئلة الذكاء الاصطناعي إلى Google Gemini إلا عندما تسأل.'
    },
    recipes: { en: 'Recipes', ar: 'الوصفات' },

    ['دقيق الذرة', []], ['دقيق الحمص', []], ['دقيق جوز الهند', []], ['دقيق اللوز', ['treenut']], ['تورتيلا الذرة', []], ['خبز الذرة', []],
    ['زيت الفول السوداني', ['peanut']], ['زبدة نباتية', []], ['كوكونت أمينوز', []], ['نودلز الأرز', []], ['شعيرية الأرز', []]
  ];
  // "Dairy-free", "egg-free" etc. on a line switch that allergen off for the line (with a reminder to verify).
  // Arabic patterns run on normalized text (see norm), so أ/إ/آ are already plain ا and ة is ه.
  var FREE_AR = '(?:خالي|خال|خاليه|بدون)\\s+(?:من\\s+)?(?:ال)?';
  var FREE_FROM = [
    [/\b(dairy|milk|lactose)[- ]free\b/g, ['milk']], [/\begg[- ]free\b/g, ['egg']], [/\b(gluten|wheat)[- ]free\b/g, ['wheat']],
    [/\bsoy[- ]free\b/g, ['soy']], [/\bpeanut[- ]free\b/g, ['peanut']], [/\bnut[- ]free\b/g, ['treenut', 'peanut']],
    [/\bsesame[- ]free\b/g, ['sesame']], [/\bvegan\b/g, ['milk', 'egg', 'fish', 'shellfish']],
    [new RegExp(FREE_AR + '(?:البان|حليب|لاكتوز)', 'g'), ['milk']], [new RegExp(FREE_AR + 'بيض', 'g'), ['egg']],
    [new RegExp(FREE_AR + '(?:غلوتين|جلوتين|قمح)', 'g'), ['wheat']], [new RegExp(FREE_AR + 'صويا', 'g'), ['soy']],
    [new RegExp(FREE_AR + 'فول السوداني', 'g'), ['peanut']], [new RegExp(FREE_AR + 'مكسرات', 'g'), ['treenut', 'peanut']],
    [new RegExp(FREE_AR + 'سمسم', 'g'), ['sesame']]

  // ---------------------------------------------------------------------------
  // State and helpers
  // ---------------------------------------------------------------------------
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function loadSel() {
    try {
      var v = JSON.parse(load('safeplate_allergens') || '[]');
      return v.filter(function (id) { return A[id]; });
    } catch (e) { return []; }
  }
  var sel = loadSel();
  var recipeFilter = { q: '', cat: 'All', show: 'all' };

  function saveSel() { store('safeplate_allergens', JSON.stringify(sel)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Lowercase, strip Arabic diacritics and unify letter variants so searches and the checker match loosely.
  function norm(s) {
    return String(s).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  }
  function hits(list) { return (list || []).filter(function (a) { return sel.indexOf(a) !== -1; }); }
  function shortName(a) { return isAr() ? A[a].ar.short : A[a].short.toLowerCase(); }
  function names(list) { return list.map(shortName).join(isAr() ? '، ' : ', '); }
  function emojis(list) { return list.map(function (a) { return '<span title="' + esc(L(A[a], 'name')) + '">' + A[a].emoji + '</span>'; }).join(' '); }
  function ingQ(i) { return isAr() ? i[3] : i[0]; }
  function ingN(i) { return isAr() ? i[4] : i[1]; }

  // What to use for one library ingredient given the user's allergens.
  function resolve(id) {
    var lib = LIB[id];
    var bad = hits(lib.a);
    var warn = hits(lib.m);
    if (!bad.length) return { kind: 'ok', lib: lib, warn: warn };
    for (var i = 0; i < lib.swaps.length; i++) {
      var o = lib.swaps[i];
      if (!hits(o.a).length) return { kind: 'swap', lib: lib, opt: o, bad: bad };
    }
    return { kind: 'none', lib: lib, bad: bad };
  }

  function recipeAllergens(r) {
    var out = [];
    r.ing.forEach(function (i) { if (i[2]) LIB[i[2]].a.forEach(function (a) { if (out.indexOf(a) === -1) out.push(a); }); });
    return ALLERGENS.map(function (a) { return a.id; }).filter(function (id) { return out.indexOf(id) !== -1; });
  }

  function recipeStatus(r) {
    var s = { swaps: 0, none: 0, warns: 0 };
    r.ing.forEach(function (i) {
      if (!i[2]) return;
      var res = resolve(i[2]);
      if (res.kind === 'swap') s.swaps++;
      else if (res.kind === 'none') s.none++;
      if (res.warn && res.warn.length) s.warns++;
    });
    s.level = s.none ? 'bad' : s.swaps ? 'swap' : 'ok';
    return s;
  }

  function statusBadge(s) {
    if (!sel.length) return '<span class="badge b-neutral">' + t('badgePick') + '</span>';
    if (s.level === 'bad') return '<span class="badge b-bad">' + esc(t('badgeNone', s.none)) + '</span>';
    if (s.level === 'swap') return '<span class="badge b-swap">' + esc(t('badgeSwaps', s.swaps)) + '</span>';
    return '<span class="badge b-ok">' + t('badgeOk') + (s.warns ? t('badgeCheck') : '') + '</span>';
  }

  // ---------------------------------------------------------------------------
  // Label / recipe checker (English and Arabic)
  // ---------------------------------------------------------------------------
  var AR_LETTER = /[؀-ۿ]/;
  var PATTERNS = (function () {
    var p = [];
    function add(phrase, a, lib) {
      var ph = norm(phrase);
      var e = ph.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Arabic words take attached prefixes (و ف ب ل ك + ال) and endings (ه ات ان ين); English takes plural s/es.
      var body = AR_LETTER.test(ph) ? '(?:[وفبلك]?(?:ال)?)' + e + '(?:ه|ات|ان|ين)?' : e + '(?:e?s)?';
      p.push({ len: ph.length, re: new RegExp('(^|[^a-z\\u0600-\\u06ff])' + body + '(?![a-z\\u0600-\\u06ff])', 'g'), a: a, lib: lib });
    }
    EXCEPTIONS.forEach(function (x) { add(x[0], x[1], null); });
    Object.keys(LIB).forEach(function (id) {
      var lib = LIB[id];
      var all = lib.a.concat(lib.m || []).filter(function (a, i, arr) { return arr.indexOf(a) === i; });
      lib.k.concat(lib.ar.k).forEach(function (k) { add(k, all, id); });
    });
    ALLERGENS.forEach(function (al) { al.hidden.concat(al.ar.hidden).forEach(function (h) { add(h, [al.id], null); }); });
    ['wheat', 'soy', 'soybean', 'gluten'].forEach(function (w) { add(w, [w === 'gluten' ? 'wheat' : w === 'soybean' ? 'soy' : w], null); });
    p.sort(function (x, y) { return y.len - x.len; });
    return p;
  })();

  function checkLine(line) {
    var text = ' ' + norm(line) + ' ';
    var freed = [];
    FREE_FROM.forEach(function (f) {
      f[0].lastIndex = 0;
      if (f[0].test(text)) { f[1].forEach(function (a) { if (freed.indexOf(a) === -1) freed.push(a); }); text = text.replace(f[0], ' '); }
      f[0].lastIndex = 0;
    });
    var found = [];
    PATTERNS.forEach(function (p) {
      text = text.replace(p.re, function (m, pre) {
        var real = p.a.filter(function (a) { return freed.indexOf(a) === -1; });
        // A library hit also carries "often contains" allergens; only the true ones count as certain.
        var sure = p.lib ? LIB[p.lib].a.filter(function (a) { return freed.indexOf(a) === -1; }) : real;
        if (real.length) found.push({ word: m.slice(pre.length).trim(), a: sure, maybe: real.filter(function (a) { return sure.indexOf(a) === -1; }), lib: p.lib });
        return pre + new Array(m.length - pre.length + 1).join(' ');
      });
    });
    return { found: found, freed: freed };
  }

        '<label class="btn ai" for="scan-cam">' + t('scanTake') + '</label>' +
        '<label class="btn ghost" for="scan-file">' + t('scanChoose') + '</label></div>' +
        '<form class="bc-form" id="bc-form"><input id="bc-input" inputmode="numeric" autocomplete="off" dir="ltr" placeholder="' + esc(t('bcTypeLabel')) + '" aria-label="' + esc(t('bcTypeLabel')) + '" />' +

  // Minimal, safe Markdown → HTML (escapes everything first).
  function renderMarkdown(md) {
    var lines = esc(md).split('\n');
    var html = '', list = null;
    function inline(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function close() { if (list) { html += '</' + list + '>'; list = null; } }
    lines.forEach(function (line) {
      var m;
      if ((m = line.match(/^\s*#{1,2}\s+(.*)/))) { close(); html += '<h3>' + inline(m[1]) + '</h3>'; }
      else if ((m = line.match(/^\s*#{3,6}\s+(.*)/))) { close(); html += '<h4>' + inline(m[1]) + '</h4>'; }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if (line.trim() === '') { close(); }
      else { close(); html += '<p>' + inline(line) + '</p>'; }
    });
    close();
    return html;
  }

  // ---------------------------------------------------------------------------
  // AI label scanner: Gemini reads a photo of the ingredient list; the app decides

  // ---------------------------------------------------------------------------
  var lastScan = null;   // { img, busy, error, data }
  var ALLERGEN_IDS = ALLERGENS.map(function (a) { return a.id; });
  var SCAN_ITEM = { type: 'OBJECT', properties: { allergen: { type: 'STRING', enum: ALLERGEN_IDS }, evidence: { type: 'STRING' } }, required: ['allergen', 'evidence'] };
  var SCAN_SCHEMA = {
    type: 'OBJECT',
    properties: {
      readable: { type: 'BOOLEAN' },
      product: { type: 'STRING' },
      ingredients_text: { type: 'STRING' },
      warnings_text: { type: 'STRING' },
      contains: { type: 'ARRAY', items: SCAN_ITEM },
      may_contain: { type: 'ARRAY', items: SCAN_ITEM },
      notes: { type: 'STRING' }
    },
    required: ['readable', 'ingredients_text', 'contains', 'may_contain']
  };

  function scanPrompt() {
    return [
      'You read photos of food packaging for people with food allergies. Be exact and conservative.',
      '1. readable: false if the photo shows no legible ingredient list (blurry, cut off, not food). Never guess ingredients you cannot see.',
      '2. product: the product name if visible, else empty.',
      '3. ingredients_text: transcribe the ingredient list exactly, in its original language (if the label has several languages, prefer English or Arabic).',
      '4. warnings_text: transcribe any "Contains", "May contain", "Made in a facility that also processes..." or similar statements exactly.',
      '5. contains: every allergen present in the ingredients or a "Contains" statement, using these ids: milk, egg, peanut, treenut, soy, wheat, fish, shellfish, sesame.',
      '   Include hidden sources: whey, casein, ghee, butter, lactose → milk; albumin, mayonnaise → egg; lecithin (soy), soya, tofu → soy; flour, semolina, malt, barley, rye, spelt, bulgur and gluten → wheat; anchovy, fish sauce → fish; shrimp, crab → shellfish; tahini → sesame; almond, cashew, hazelnut, pistachio, walnut, pecan, praline → treenut. Coconut and nutmeg are not tree nuts.',
      '   evidence: the exact word(s) from the label that show it.',
      '6. may_contain: allergens only in precautionary statements ("may contain", "traces of", "same facility/line").',
      '7. notes: one or two short sentences in ' + (isAr() ? 'Arabic' : 'English') + ' about anything unclear (e.g. part of the list is hidden, "natural flavors", unspecified "vegetable oil" or "lecithin").'
    ].join('\n');

  // Shrink the photo before sending: faster on mobile data and well within API limits.
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('image')); };
        img.onload = function () {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function scanImage(file) {
    if (!file) return;
    if (!apiKey()) { lastScan = { needKey: true }; drawScan(); return; }
    var job = lastScan = { busy: true };
    drawScan();
    shrinkImage(file).then(function (dataUrl) {
      job.img = dataUrl;
      if (job === lastScan) drawScan();
      return fetch(GEMINI_BASE + '/models/' + encodeURIComponent(GEMINI_MODEL) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [
            { inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } },
            { text: scanPrompt() }
          ] }],
          generationConfig: { temperature: 0, responseMimeType: 'application/json', responseSchema: SCAN_SCHEMA, maxOutputTokens: 4096 }
        })
      });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (!res.ok) throw new Error(explainError(res.status, d.error && d.error.message));
        var cand = d.candidates && d.candidates[0];
        var text = ((cand && cand.content && cand.content.parts) || []).filter(function (p) { return p.text && !p.thought; }).map(function (p) { return p.text; }).join('');
        text = text.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '');
        if (!text) throw new Error(t('errEmpty'));
        return JSON.parse(text);
      });
    }).then(function (data) {
      job.busy = false;
      job.data = cleanScan(data);
      if (job === lastScan) drawScan();
    }).catch(function (err) {
      job.busy = false;
      job.error = err instanceof TypeError ? t('errNetwork') : err instanceof SyntaxError ? t('errEmpty') : err.message;
      if (job === lastScan) drawScan();
    });
  }

  // Keep only known allergen ids, then add anything SafePlate's own word list finds
  // in the transcribed ingredients that the AI missed.
  function cleanScan(d) {
    function list(arr) {
      var seen = {};
      return (arr || []).filter(function (x) { return x && ALLERGEN_IDS.indexOf(x.allergen) !== -1 && !seen[x.allergen] && (seen[x.allergen] = true); });
    }
    var out = { readable: d.readable !== false, product: d.product || '', ingredients: d.ingredients_text || '', warnings: d.warnings_text || '', notes: d.notes || '',
      contains: list(d.contains), may: list(d.may_contain) };
    var have = out.contains.map(function (x) { return x.allergen; });
    out.ingredients.split(/[,،;\n()\[\]]/).forEach(function (part) {
      if (!part.trim()) return;
      checkLine(part).found.forEach(function (f) {
        f.a.forEach(function (a) {
          if (have.indexOf(a) === -1) { have.push(a); out.contains.push({ allergen: a, evidence: f.word, local: true }); }
        });
      });
    });
    out.may = out.may.filter(function (x) { return have.indexOf(x.allergen) === -1; });
    return out;
  }

      (s.source === 'off' ? '<div class="tip" style="margin-top:8px">ℹ️ ' + t('offSource') + ' <a href="https://world.openfoodfacts.org/product/' + esc(s.code) + '" target="_blank" rel="noopener">' + t('offView') + ' ↗</a></div>' : '') +

  // ---------------------------------------------------------------------------
  // Barcode lookup: camera (native BarcodeDetector, or the bundled ZXing library on
  // iPhone and other browsers without it), then Open Food Facts, a free database.
  // ---------------------------------------------------------------------------
  var OFF_MAP = { 'en:milk': 'milk', 'en:eggs': 'egg', 'en:peanuts': 'peanut', 'en:nuts': 'treenut', 'en:soybeans': 'soy', 'en:gluten': 'wheat',
    'en:fish': 'fish', 'en:crustaceans': 'shellfish', 'en:molluscs': 'shellfish', 'en:sesame-seeds': 'sesame' };
  var OFF_FIELDS = 'code,product_name,product_name_en,product_name_ar,brands,allergens_tags,traces_tags,ingredients_text,ingredients_text_en,ingredients_text_ar,image_front_small_url';
  var bc = { stream: null, timer: null, reader: null, done: true };
  var detectorPromise = null;

  function loadZxing() {
    return new Promise(function (resolve, reject) {

      var sc = document.createElement('script');
      sc.src = 'vendor/zxing.min.js';
      sc.onload = function () { resolve({ native: false }); };
      sc.onerror = function () { detectorPromise = null; reject(new Error('zxing')); };
      document.head.appendChild(sc);
    });
  }
  function getDetector() {
    if (detectorPromise) return detectorPromise;
    var wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
    detectorPromise = ('BarcodeDetector' in window && BarcodeDetector.getSupportedFormats
      ? BarcodeDetector.getSupportedFormats().then(function (f) {
          var ok = wanted.filter(function (x) { return f.indexOf(x) !== -1; });
          return ok.indexOf('ean_13') !== -1 ? { native: true, detector: new BarcodeDetector({ formats: ok }) } : loadZxing();
        }).catch(loadZxing)
      : loadZxing());

  function bcStatus(msg) { document.getElementById('bc-status').textContent = msg; }
  function openBarcode() {
    var video = document.getElementById('bc-video');
    document.getElementById('bc-modal').classList.add('open');
    bc.done = false;
    bcStatus(t('bcStarting'));
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { bcStatus(t('bcNoCam')); return; }
    var constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };
    getDetector().then(function (det) {
      if (bc.done) return;
      if (det.native) {
        return navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
          bc.stream = stream;
          if (bc.done) { stopCamera(); return; }
          video.srcObject = stream;
          return video.play().then(function () { bcStatus(t('bcHint')); nativeLoop(det.detector); });
        });
      }
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);

        if (result) gotBarcode(result.getText());

  }

    if (bc.stream) { bc.stream.getTracks().forEach(function (tr) { tr.stop(); }); bc.stream = null; }
    var video = document.getElementById('bc-video');
    if (video.srcObject) { video.srcObject.getTracks && video.srcObject.getTracks().forEach(function (tr) { tr.stop(); }); video.srcObject = null; }

  function gotBarcode(code) {

  function lookupBarcode(code) {
    var job = lastScan = { busy: true, source: 'off', code: code };
    drawScan();
    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + OFF_FIELDS)
      .then(function (res) {
        if (res.status === 404) return { status: 0 };
        if (!res.ok) throw new Error('Open Food Facts ' + res.status);
        return res.json();
      })
      .then(function (d) {
        if (job !== lastScan) return;
        job.busy = false;
        var p = d && d.status !== 0 && d.product;
        if (!p) { job.notFound = true; drawScan(); return; }
        function tags(list) {
          var out = [];
          (list || []).forEach(function (tg) {
            var id = OFF_MAP[tg];
            if (id && !out.some(function (x) { return x.allergen === id; })) out.push({ allergen: id, evidence: tg.replace(/^[a-z]{2}:/, '').replace(/-/g, ' ') + ' · ' + t('offTag') });
          });
          return out;
        }
        var ingredients = (isAr() ? p.ingredients_text_ar || p.ingredients_text || p.ingredients_text_en : p.ingredients_text_en || p.ingredients_text || p.ingredients_text_ar) || '';
        var name = (isAr() ? p.product_name_ar || p.product_name : p.product_name_en || p.product_name) || '';
        var contains = tags(p.allergens_tags), may = tags(p.traces_tags);
        job.img = p.image_front_small_url || '';

          readable: !!(ingredients.trim() || contains.length || may.length),
          product: [name, p.brands].filter(Boolean).join(' · '),
          ingredients_text: ingredients, warnings_text: '', notes: '',
          contains: contains, may_contain: may
        });

      })
      .catch(function (err) {
        if (job !== lastScan) return;
        job.busy = false;
        job.error = err instanceof TypeError ? t('errNetwork') : err.message;

  }

  // Draws the card as a PNG so it can be saved or shared in chat apps.
  function cardImage(cfg) {
    var W = 1080, PAD = 64, FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif';
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    function wrap(text, font, maxW, rtl) {
      ctx.font = font; ctx.direction = rtl ? 'rtl' : 'ltr';
      var words = text.split(' '), lines = [], line = '';
      words.forEach(function (w) {
        var test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
      });
      if (line) lines.push(line);
      return lines;
    }
    // Build a list of rows first so the canvas height fits the content.
    var rows = [];
    ['en', 'ar'].forEach(function (lg, idx) {
      var rtl = lg === 'ar', c = cardParts(cfg, lg);
      if (idx) rows.push({ sep: true, h: 48 });
      function add(text, size, bold, indent) {
        var font = (bold ? '700 ' : '400 ') + size + 'px ' + FONT;
        wrap(text, font, W - PAD * 2 - (indent || 0), rtl).forEach(function (ln) { rows.push({ text: ln, font: font, rtl: rtl, indent: indent || 0, h: Math.round(size * 1.5) }); });
        rows.push({ h: Math.round(size * 0.5) });
      }
      if (c.name) add(c.name, 40, true);
      add(c.intro, 38, false);
      c.items.forEach(function (i) { add('• ' + i, 38, true, 24); });
      add(c.care, 34, false);
      if (c.epi) add(c.epi, 34, true);
      add(c.thanks, 34, false);
    });
    var HEAD = 140;
    var H = HEAD + PAD + rows.reduce(function (sum, r) { return sum + r.h; }, 0) + 70;
    cv.width = W; cv.height = H;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#b91c1c'; ctx.fillRect(0, 0, W, HEAD);
    ctx.lineWidth = 12; ctx.strokeStyle = '#b91c1c'; ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle';
    ctx.font = '800 50px ' + FONT; ctx.direction = 'ltr'; ctx.textAlign = 'left';
    ctx.fillText('⚠ ' + CARD_TEXT.en.title, PAD, HEAD / 2);
    ctx.direction = 'rtl'; ctx.textAlign = 'right';
    ctx.fillText(CARD_TEXT.ar.title, W - PAD, HEAD / 2);
    var y = HEAD + PAD;
    ctx.textBaseline = 'top';
    rows.forEach(function (r) {
      if (r.sep) {
        ctx.strokeStyle = '#d6cfc0'; ctx.lineWidth = 3; ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(PAD, y + r.h / 2); ctx.lineTo(W - PAD, y + r.h / 2); ctx.stroke(); ctx.setLineDash([]);
      } else if (r.text) {
        ctx.font = r.font; ctx.fillStyle = '#1f2a1f';
        ctx.direction = r.rtl ? 'rtl' : 'ltr'; ctx.textAlign = r.rtl ? 'right' : 'left';
        ctx.fillText(r.text, r.rtl ? W - PAD - r.indent : PAD + r.indent, y);
      }
      y += r.h;
    });
    ctx.font = '400 26px ' + FONT; ctx.fillStyle = '#6b705f'; ctx.direction = 'ltr'; ctx.textAlign = 'center';
    ctx.fillText('SafePlate · nightshiftgames123.github.io/safeplate', W / 2, H - 50);
    return new Promise(function (resolve) { cv.toBlob(resolve, 'image/png'); });
  }

  function explainError(status, message) {
    var m = message || '';
    if (status === 400 && /api key/i.test(m)) return t('errKey');
    if (status === 403) return t('errForbidden');
    if (status === 429) return t('errRate');
    if (status >= 500) return t('errServer') + ' (' + status + ')';
    return 'Gemini ' + status + ': ' + m;
  }

  function send(text) {
    text = (text || '').trim();
    if (!text || aiBusy) return;
    if (!apiKey()) {
      drawChat(); showAiError(t('aiNeedKey'));
      var ki = document.getElementById('key-input'); if (ki) ki.focus();
      return;
    }
    chat.push({ role: 'user', text: text });
    var reply = { role: 'model', text: '' };
    chat.push(reply);
    aiBusy = true;
    if (location.hash === '#ai') renderAi(); // clears the box and the idea chips
    var box = document.getElementById('chat');
    if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ block: 'nearest' });

    var contents = chat.slice(0, -1).map(function (m) { return { role: m.role, parts: [{ text: m.text }] }; });
    var finish = null, blocked = null;
    fetch(GEMINI_BASE + '/models/' + encodeURIComponent(GEMINI_MODEL) + ':streamGenerateContent?alt=sse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: systemPrompt() }] },
        contents: contents,
        generationConfig: { temperature: 0.5, maxOutputTokens: 4096 }
      })
    }).then(function (res) {
      if (!res.ok) return res.json().catch(function () { return {}; }).then(function (d) { throw new Error(explainError(res.status, d.error && d.error.message)); });
      // Stream Server-Sent Events and render as text arrives.
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += decoder.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (line.indexOf('data:') !== 0) continue;
            var chunk;
            try { chunk = JSON.parse(line.slice(5)); } catch (e) { continue; }
            if (chunk.error) throw new Error(chunk.error.message || 'Gemini error');
            if (chunk.promptFeedback && chunk.promptFeedback.blockReason) blocked = chunk.promptFeedback.blockReason;
            var cand = chunk.candidates && chunk.candidates[0];
            if (cand && cand.finishReason) finish = cand.finishReason;
            ((cand && cand.content && cand.content.parts) || []).forEach(function (part) { if (part.text && !part.thought) reply.text += part.text; });
            drawChat();
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (blocked || !reply.text) throw new Error(t('errEmpty') + (blocked ? ' (' + blocked + ')' : finish ? ' (' + finish + ')' : ''));
      if (finish === 'MAX_TOKENS') reply.cut = true;
      aiBusy = false;
      if (location.hash === '#ai') renderAi();
    }).catch(function (err) {
      aiBusy = false;
      var msg = err instanceof TypeError ? t('errNetwork') : err.message;
      // A turn with no answer is dropped, so the conversation stays valid; the question goes back in the box.
      if (!reply.text) chat.splice(chat.length - 2, 2);
      if (location.hash !== '#ai') return;
      renderAi();
      showAiError(msg);
      var inp = document.getElementById('ai-input');
      if (inp && !reply.text) inp.value = text;
    });
  }

  // ---------------------------------------------------------------------------

  var deferredInstall = null;
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function syncInstallBtn() {
    var b = document.getElementById('install-btn');
    b.textContent = t('installBtn');
    b.setAttribute('aria-label', t('installLabel')); b.title = t('installLabel');
    b.hidden = isStandalone() || !(deferredInstall || isIos());
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    syncInstallBtn();
  });
  window.addEventListener('appinstalled', function () { deferredInstall = null; syncInstallBtn(); });
  document.getElementById('install-btn').addEventListener('click', function () {
    if (deferredInstall) {
      var ev = deferredInstall;
      ev.prompt();

    } else {

  function route() {
    var h = location.hash.replace(/^#/, '') || 'recipes';
    var tab = h.indexOf('r/') === 0 ? 'recipes' : h;
    document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    if (h.indexOf('r/') === 0) renderRecipe(h.slice(2));
    else if (h === 'swaps') renderSwaps();
    else if (h === 'check') renderCheck();
    else if (h === 'ai') renderAi();
    else if (h === 'card') renderCard();
    else renderRecipes();
  }
  window.addEventListener('hashchange', function () { route(); if (location.hash.indexOf('#r/') !== 0) window.scrollTo(0, 0); });

  var themeBtn = document.getElementById('theme-btn');
  function syncThemeBtn() { themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
  themeBtn.addEventListener('click', function () {
    var th = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th);
    store('safeplate_theme', th);
    syncThemeBtn();
  });

  syncThemeBtn();
  renderChrome();
  route();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
</body>
</html>
