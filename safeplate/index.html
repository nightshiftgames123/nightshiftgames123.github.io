<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#c2410c" />
  <meta name="description" content="Common recipes rewritten for your food allergies, with ingredient swaps, a label checker and an AI chef. English and Arabic." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SafePlate" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="sp-icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="sp-favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="sp-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" />
  <title>SafePlate · Allergy-Friendly Recipes</title>
  <script>
    // Apply theme and language before first paint to avoid a flash.
    (function () {
      var t = null, l = null;
      try { t = localStorage.getItem('safeplate_theme'); l = localStorage.getItem('safeplate_lang'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var q = /[?&]lang=(ar|en)\b/.exec(location.search);
      if (q) l = q[1];
      if (l !== 'ar' && l !== 'en') l = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
      var d = document.documentElement;
      d.setAttribute('data-theme', t);
      d.setAttribute('lang', l);
      d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>
  <style>
    :root {
      --bg: #fbf6ee;
      --card: #ffffff;
      --border: #eadfcf;
      --text: #2a1d15;
      --muted: #6e5e52;
      --accent: #c2410c;
      --accent-soft: #fde8dc;
      --accent-text: #ffffff;
      --swap: #7a5300;
      --swap-soft: #fbefc4;
      --bad: #a3200b;
      --bad-soft: #fce1dc;
      --ok: #2f6b3a;
      --ok-soft: #e2f0df;
      --ai: #9a330a;
      --ai-soft: #fde8dc;
      --ink: #2a1d15;
      --ink-muted: #cdbba9;
      --t1: #fce3cf; --t2: #f8dce0; --t3: #fbefc4; --t4: #e6eedb; --t5: #dcebf5; --t6: #ddf0e4;
      --shadow: 0 1px 2px rgba(42, 29, 21, .05), 0 6px 18px rgba(42, 29, 21, .05);
      --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #1a1411;
      --card: #251d18;
      --border: #3a2e26;
      --text: #f6ede3;
      --muted: #bba897;
      --accent: #ff8a4c;
      --accent-soft: #3d2418;
      --accent-text: #1a1411;
      --swap: #f7c873;
      --swap-soft: #3a2e12;
      --bad: #ff8f80;
      --bad-soft: #3e1d18;
      --ok: #8fd19a;
      --ok-soft: #1e3322;
      --ai: #ffb27a;
      --ai-soft: #3d2418;
      --ink: #0f0b09;
      --ink-muted: #bba897;
      --t1: #3d2a1d; --t2: #3b2427; --t3: #3a3018; --t4: #29321f; --t5: #1f2d38; --t6: #1e3327;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    [lang="ar"] body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif; line-height: 1.7; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--accent); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

    header.top {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
    .brand .tag { color: var(--muted); font-size: 13px; }
    .brand .spacer { flex: 1; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--card); border-radius: 10px;
      min-width: 38px; height: 38px; cursor: pointer; font-size: 18px; padding: 0 8px;
    }
    .lang-btn { font-size: 14px; font-weight: 700; }
    .install-btn { font-size: 14px; font-weight: 700; background: var(--accent); border-color: var(--accent); color: var(--accent-text); white-space: nowrap; padding: 0 10px; flex: none; }
    .install-btn[hidden] { display: none; }
    .ios-steps { padding-inline-start: 22px; }
    .ios-steps li { margin-bottom: 10px; }

    .avoid { padding: 4px 0 12px; }
    .avoid-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .avoid-label button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
    .avoid-actions { display: flex; gap: 12px; flex-shrink: 0; margin-inline-start: 10px; }
    .avoid-actions button[hidden] { display: none; }
    .people { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .person {
      border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px;
      padding: 5px 11px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .person[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .person.add { border-style: dashed; color: var(--accent); font-weight: 500; }
    .chips.locked .chip { opacity: .75; }
    .avoid-label.flash #avoid-summary { color: var(--bad); font-weight: 600; }
    .units { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; float: inline-end; }
    .units button { border: 0; background: none; color: var(--muted); padding: 3px 11px; font-size: 13px; cursor: pointer; }
    .units button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .ing .orig { color: var(--muted); font-weight: 400; font-size: .85em; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--border); background: var(--card); border-radius: 999px;
      padding: 6px 11px; cursor: pointer; font-size: 14px; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .chip[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
    .chip[aria-pressed="true"]::before { content: "✕ "; }
    .chip.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .chip.filter[aria-pressed="true"]::before { content: ""; }
    .chip.idea { border-color: var(--ai); color: var(--ai); background: var(--ai-soft); white-space: normal; text-align: start; }

    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabs a {
      flex: 1; max-width: 200px; text-align: center; text-decoration: none; color: var(--muted);
      padding: 9px 2px 10px; font-size: 12px; font-weight: 600; line-height: 1.3;
    }
    nav.tabs a span { display: block; font-size: 21px; line-height: 1.2; }
    nav.tabs a.active { color: var(--accent); }

    main { padding-top: 16px; }
    h2 { font-size: 22px; margin: 4px 0 12px; letter-spacing: -.01em; }
    h3 { font-size: 17px; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .search {
      width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); outline: none;
    }
    .search:focus, textarea:focus { border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; box-shadow: var(--shadow);
    }
    a.rcard { display: flex; gap: 12px; text-decoration: none; color: inherit; align-items: flex-start; }
    a.rcard:hover { border-color: var(--accent); }
    .remoji {
      font-size: 30px; width: 52px; height: 52px; flex: none; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; background: var(--bg);
    }
    .rcard h3 { margin: 0 0 2px; font-size: 16px; }
    .meta { font-size: 13px; color: var(--muted); }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px;
      padding: 2px 9px; margin-top: 6px;
    }
    .b-ok { background: var(--ok-soft); color: var(--ok); }
    .b-swap { background: var(--swap-soft); color: var(--swap); }
    .b-bad { background: var(--bad-soft); color: var(--bad); }
    .b-neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .contains { font-size: 13px; margin-top: 4px; letter-spacing: 1px; }

    .back { display: inline-block; margin-bottom: 10px; text-decoration: none; font-weight: 600; }
    .hero { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .hero .remoji { width: 64px; height: 64px; font-size: 38px; background: var(--card); border: 1px solid var(--border); }
    .hero h2 { margin: 0; }

    .cols { display: grid; gap: 14px; }
    @media (min-width: 760px) { .cols { grid-template-columns: 5fr 6fr; align-items: start; } }

    ul.ing { list-style: none; padding: 0; margin: 0; }
    ul.ing li { padding: 9px 0; border-bottom: 1px dashed var(--border); }
    ul.ing li:last-child { border-bottom: 0; }
    .q { font-weight: 600; }
    .was { text-decoration: line-through; color: var(--muted); font-size: 14px; }
    .now { color: var(--swap); font-weight: 600; }
    .tip { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .warn { font-size: 13px; color: var(--swap); margin-top: 3px; }
    .nope { color: var(--bad); font-weight: 600; }

    ol.steps { padding-inline-start: 22px; margin: 0; }
    ol.steps li { margin-bottom: 10px; }
    mark { background: var(--swap-soft); color: var(--swap); border-radius: 4px; padding: 0 3px; font-weight: 600; }
    mark.bad { background: var(--bad-soft); color: var(--bad); }

    .note.source { margin-top: 10px; } .note.source > div + div { margin-top: 4px; }
    .src { margin-top: 3px; } .src a { font-weight: 600; } .untested { color: #b45309; }
    .note.source a { font-weight: 600; }
    .note {
      border-inline-start: 4px solid var(--swap); background: var(--swap-soft);
      padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px;
    }
    .note.safe { border-color: var(--ok); background: var(--ok-soft); }
    .note.danger { border-color: var(--bad); background: var(--bad-soft); }
    .note.ai { border-color: var(--ai); background: var(--ai-soft); }

    .swap-section { margin-bottom: 18px; }
    .swap-section > .card { padding: 0; overflow: hidden; }
    .swap-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .swap-row { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .swap-row:last-child { border-bottom: 0; }
    .opt { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 15px; }
    .opt .mark { flex: none; width: 18px; text-align: center; }
    .opt.unsafe { color: var(--muted); }
    .opt.best { font-weight: 600; }
    .pill {
      display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px;
      background: var(--bad-soft); color: var(--bad); margin-inline-start: 4px; font-weight: 600;
    }
    .pill.soft { background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
    .hidden-words { font-size: 14px; }

    textarea {
      width: 100%; min-height: 180px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); padding: 12px 14px; outline: none; resize: vertical;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; cursor: pointer;
      background: var(--accent); color: var(--accent-text); text-decoration: none; display: inline-block; text-align: center;
    }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn.ai { background: var(--ai); color: #fff; }
    [data-theme="dark"] .btn.ai { color: #1a1030; }
    [data-theme="dark"] .untested { color: #fbbf24; }
    .btn.small { padding: 7px 12px; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
    .result-line { padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .result-line:last-child { border-bottom: 0; }

    /* AI chef */
    .key-card label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    .key-card input[type="password"] {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); outline: none;
    }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
    .chat { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
    .msg { max-width: 92%; padding: 10px 14px; border-radius: 16px; font-size: 15px; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-end-end-radius: 4px; white-space: pre-wrap; }
    .msg.model { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-end-start-radius: 4px; }
    .msg.model h3 { font-size: 16px; margin: 10px 0 6px; }
    .msg.model h4 { font-size: 15px; margin: 8px 0 4px; }
    .msg.model p { margin: 6px 0; }
    .msg.model ul, .msg.model ol { margin: 6px 0; padding-inline-start: 22px; }
    .msg.model li { margin-bottom: 4px; }
    .msg .err { color: var(--bad); }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea { min-height: 52px; height: 52px; flex: 1; }

    /* Ko-fi support card on the recipes page, like Nasma AI's: hidden for 5 days after ✕. */
    .kofi-wrap { padding-top: 0; padding-bottom: 0; }
    .kofi { display: none; align-items: center; gap: 12px; border-radius: 18px; padding: 10px 10px 10px 12px; margin-top: 12px; background: var(--kofi-bg); border: 1px solid var(--kofi-line); }
    .kofi.ready { display: flex; }
    .kofi .cup { width: 40px; height: 40px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--kofi-tile); }
    .kofi .t { font-weight: 700; font-size: 14px; }
    .kofi .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
    .kofi a.go { flex: none; padding: 9px 14px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(180deg, #f4845f, #e0643d); box-shadow: 0 4px 12px rgba(224, 100, 61, .3); white-space: nowrap; }
    .kofi .x { width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; flex: none; border-radius: 8px; padding: 0; }
    :root { --kofi-bg: linear-gradient(100deg, #fff4ea, #fdebe1); --kofi-tile: #fff; --kofi-line: #f6d9c8; }
    [data-theme="dark"] { --kofi-bg: linear-gradient(100deg, rgba(244, 132, 95, .16), rgba(244, 132, 95, .08)); --kofi-tile: rgba(255, 255, 255, .06); --kofi-line: rgba(244, 132, 95, .25); }
    #splash { position: fixed; inset: 0; z-index: 100; background: #130f30; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .45s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash video { width: min(72vw, 340px); height: auto; aspect-ratio: 480 / 476; border-radius: 13%; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); display: block; background: #130f30; }
    #splash .skip { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); font-size: 13px; color: #8c949a; }
    .welcome { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: 20px 16px 32px; }
    .welcome[hidden] { display: none; }
    .welcome-in { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .welcome-top { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .welcome-top img { width: 44px; height: 44px; border-radius: 12px; }
    .welcome-top b { font-size: 20px; flex: 1; }
    .welcome h2 { font-size: 26px; margin: 0 0 6px; }
    .welcome p { color: var(--muted); margin: 0 0 18px; }
    .welcome input[type="text"] { width: 100%; font-size: 18px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .welcome .btn { width: 100%; margin-top: 14px; font-size: 16px; padding: 13px 18px; }
    .welcome .link { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 14px; padding: 12px 0 0; display: block; margin: 0 auto; }
    .who { display: flex; flex-direction: column; gap: 10px; }
    .who button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 14px; padding: 14px 16px; font-size: 17px; font-weight: 700;
    }
    .who button small { font-weight: 400; color: var(--muted); font-size: 13px; margin-inline-start: auto; text-align: end; }
    .who button.add { border-style: dashed; color: var(--accent); font-weight: 600; }
    .welcome .chips { gap: 8px; }
    .welcome .chip { font-size: 16px; padding: 9px 14px; }
    /* Welcome tour: four slides explaining the app, before the name step. */
    .tour { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    .tour-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
    .tour-top .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
    .tour-top .brand img { width: 30px; height: 30px; border-radius: 9px; }
    .tour-top .acts { display: flex; align-items: center; gap: 4px; }
    .tour-top .skip { background: none; border: 0; color: var(--muted); font-size: 15px; font-weight: 600; padding: 10px 8px; cursor: pointer; }
    .tour-art { flex: 1; min-height: 250px; display: flex; align-items: center; justify-content: center; position: relative; margin: 8px 0 4px; }
    .tour-art::before { content: ""; position: absolute; width: min(78vw, 320px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--accent-soft), transparent 70%); }
    .tour-copy { text-align: center; padding: 0 6px; }
    .tour-copy h2 { font-size: 27px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.01em; }
    .tour-copy p { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0 auto; max-width: 360px; }
    .tour-copy .fine { font-size: 13px; margin-top: 12px; }
    .tour-dots { display: flex; justify-content: center; gap: 7px; margin: 22px 0 6px; }
    .tour-dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: var(--border); cursor: pointer; transition: width .25s, background .25s; }
    .tour-dots button[aria-current="true"] { width: 24px; background: var(--accent); }
    .tour .btn { width: 100%; margin-top: 12px; font-size: 17px; padding: 14px 18px; border-radius: 14px; }
    .tour .back { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 12px; display: block; margin: 0 auto; visibility: hidden; }
    .tour .back.on { visibility: visible; }
    .tour-anim { animation: tour-in .38s ease both; }
    .tour-anim.rev { animation-name: tour-in-rev; }
    @keyframes tour-in { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
    @keyframes tour-in-rev { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
    [dir="rtl"] .tour-anim { animation-name: tour-in-rev; }
    [dir="rtl"] .tour-anim.rev { animation-name: tour-in; }
    @media (prefers-reduced-motion: reduce) { .tour-anim, .tour-anim.rev { animation: none; } }
    /* Slide 1: dishes */
    .t-dishes { position: relative; width: 270px; height: 250px; }
    .t-dishes img { position: absolute; width: 132px; height: 132px; border-radius: 26px; object-fit: cover; box-shadow: 0 14px 30px rgba(60, 30, 10, .22); border: 4px solid var(--card); }

      try { seen = sessionStorage.getItem('safeplate_splash'); sessionStorage.setItem('safeplate_splash', '1'); } catch (e) {}

      function close() {
        if (done) return; done = true;
        sp.classList.add('out');
        setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450);
      }
      var v = document.getElementById('splash-video');
      var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (still) { v.removeAttribute('autoplay'); v.pause(); }
      v.addEventListener('ended', function () { setTimeout(close, 250); });
      sp.addEventListener('click', close);
      // Whatever happens to the video (blocked, offline, slow), never hold the app back for long.
      setTimeout(close, still ? 1800 : 4200);

  // ---------------------------------------------------------------------------
  // Label / recipe checker (English and Arabic)
  // ---------------------------------------------------------------------------
  var AR_LETTER = /[؀-ۿ]/;
  var PATTERNS = (function () {
    var p = [];
    function add(phrase, a, lib) {
      var ph = norm(phrase);
      var e = ph.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Arabic words take attached prefixes (و ف ب ل ك + ال) and endings (ه ات ان ين); English takes plural s/es.
      var body = AR_LETTER.test(ph) ? '(?:[وفبلك]?(?:ال)?)' + e + '(?:ه|ات|ان|ين)?' : e + '(?:e?s)?';
      p.push({ len: ph.length, re: new RegExp('(^|[^a-z\\u0600-\\u06ff])' + body + '(?![a-z\\u0600-\\u06ff])', 'g'), a: a, lib: lib });
    }
    EXCEPTIONS.forEach(function (x) { add(x[0], x[1], null); });
    Object.keys(LIB).forEach(function (id) {
      var lib = LIB[id];
      var all = lib.a.concat(lib.m || []).filter(function (a, i, arr) { return arr.indexOf(a) === i; });
      lib.k.concat(lib.ar.k).forEach(function (k) { add(k, all, id); });
    });
    ALLERGENS.forEach(function (al) { al.hidden.concat(al.ar.hidden, FR_HIDDEN[al.id] || []).forEach(function (h) { add(h, [al.id], null); }); });
    ['wheat', 'soy', 'soybean', 'gluten'].forEach(function (w) { add(w, [w === 'gluten' ? 'wheat' : w === 'soybean' ? 'soy' : w], null); });
    p.sort(function (x, y) { return y.len - x.len; });
    return p;
  })();

  function checkLine(line) {
    var text = ' ' + norm(line) + ' ';
    var freed = [];
    FREE_FROM.forEach(function (f) {
      f[0].lastIndex = 0;
      if (f[0].test(text)) { f[1].forEach(function (a) { if (freed.indexOf(a) === -1) freed.push(a); }); text = text.replace(f[0], ' '); }
      f[0].lastIndex = 0;
    });
    var found = [];
    PATTERNS.forEach(function (p) {
      text = text.replace(p.re, function (m, pre) {
        var real = p.a.filter(function (a) { return freed.indexOf(a) === -1; });
        // A library hit also carries "often contains" allergens; only the true ones count as certain.
        var sure = p.lib ? LIB[p.lib].a.filter(function (a) { return freed.indexOf(a) === -1; }) : real;
        if (real.length) found.push({ word: m.slice(pre.length).trim(), a: sure, maybe: real.filter(function (a) { return sure.indexOf(a) === -1; }), lib: p.lib });
        return pre + new Array(m.length - pre.length + 1).join(' ');
      });
    });
    return { found: found, freed: freed };
  }

  // Minimal, safe Markdown → HTML (escapes everything first).
  function renderMarkdown(md) {
    var lines = esc(md).split('\n');
    var html = '', list = null;
    function inline(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function close() { if (list) { html += '</' + list + '>'; list = null; } }
    lines.forEach(function (line) {
      var m;
      if ((m = line.match(/^\s*#{1,2}\s+(.*)/))) { close(); html += '<h3>' + inline(m[1]) + '</h3>'; }
      else if ((m = line.match(/^\s*#{3,6}\s+(.*)/))) { close(); html += '<h4>' + inline(m[1]) + '</h4>'; }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if (line.trim() === '') { close(); }
      else { close(); html += '<p>' + inline(line) + '</p>'; }
    });
    close();
    return html;
  }

  // Shrink the photo before sending: faster on mobile data and well within API limits.
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('image')); };
        img.onload = function () {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function scanImage(file) {
    if (!file) return;
    if (!aiReady()) { lastScan = { needKey: true }; drawScan(); return; }
    var job = lastScan = { busy: true };
    drawScan();
    shrinkImage(file).then(function (dataUrl) {
      job.img = dataUrl;
      if (job === lastScan) drawScan();
      return aiFetch('scan', {
        contents: [{ role: 'user', parts: [
          { inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } },
          { text: scanPrompt() }
        ] }],
        generationConfig: { temperature: 0, responseMimeType: 'application/json', responseSchema: SCAN_SCHEMA, maxOutputTokens: 4096 }
      }, { image: dataUrl.split(',')[1], prompt: scanPrompt(), schema: SCAN_SCHEMA });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (!res.ok) throw new Error(explainError(res.status, d.error && d.error.message, d.error && d.error.code));
        var cand = d.candidates && d.candidates[0];
        var text = ((cand && cand.content && cand.content.parts) || []).filter(function (p) { return p.text && !p.thought; }).map(function (p) { return p.text; }).join('');
        text = text.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '');
        if (!text) throw new Error(t('errEmpty'));
        return JSON.parse(text);
      });
    }).then(function (data) {
      job.busy = false;
      job.data = cleanScan(data);
      if (job === lastScan) drawScan();
    }).catch(function (err) {
      job.busy = false;
      job.error = err instanceof TypeError ? t('errNetwork') : err instanceof SyntaxError ? t('errEmpty') : err.message;
      if (job === lastScan) drawScan();
    });
  }

  // Keep only known allergen ids, then add anything SafePlate's own word list finds
  // in the transcribed ingredients that the AI missed.
  function cleanScan(d) {
    function list(arr) {
      var seen = {};
      return (arr || []).filter(function (x) { return x && ALLERGEN_IDS.indexOf(x.allergen) !== -1 && !seen[x.allergen] && (seen[x.allergen] = true); });
    }
    var out = { readable: d.readable !== false, product: d.product || '', ingredients: d.ingredients_text || '', warnings: d.warnings_text || '', notes: d.notes || '',
      contains: list(d.contains), may: list(d.may_contain) };
    var have = out.contains.map(function (x) { return x.allergen; });
    (d.check_text || out.ingredients).split(/[,،;\n()\[\]]/).forEach(function (part) {
      if (!part.trim()) return;
      checkLine(part).found.forEach(function (f) {
        f.a.forEach(function (a) {
          if (have.indexOf(a) === -1) { have.push(a); out.contains.push({ allergen: a, evidence: f.word, local: true }); }
        });
      });
    });
    out.may = out.may.filter(function (x) { return have.indexOf(x.allergen) === -1; });
    return out;
  }

  function bcStatus(msg) { document.getElementById('bc-status').textContent = msg; }

    bcStatus(t('bcStarting'));
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { bcStatus(t('bcNoCam')); return; }
    var constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };

  function lookupBarcode(code) {
    var job = lastScan = { busy: true, source: 'off', code: code };
    drawScan();
    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + OFF_FIELDS)
      .then(function (res) {
        if (res.status === 404) return { status: 0 };
        if (!res.ok) throw new Error('Open Food Facts ' + res.status);
        return res.json();
      })
      .then(function (d) {
        if (job !== lastScan) return;
        job.busy = false;
        var p = d && d.status !== 0 && d.product;
        if (!p) { job.notFound = true; drawScan(); return; }
        // Allergen tags the database knows; unknown or non-English tags go through the word list.
        function tags(list) {
          var out = [];
          function push(id, ev) { if (id && !out.some(function (x) { return x.allergen === id; })) out.push({ allergen: id, evidence: ev + ' · ' + t('offTag') }); }
          (list || []).forEach(function (tg) {
            var word = tg.replace(/^[a-z]{2}:/, '').replace(/-/g, ' ');
            if (OFF_MAP[tg]) push(OFF_MAP[tg], word);
            else checkLine(word).found.forEach(function (f) { f.a.forEach(function (a) { push(a, word); }); });
          });
          return out;
        }
        var texts = [p.ingredients_text_en, p.ingredients_text_ar, p.ingredients_text, p.ingredients_text_fr].filter(function (x) { return x && x.trim(); });
        var ingredients = (isAr() ? p.ingredients_text_ar || p.ingredients_text || p.ingredients_text_en || p.ingredients_text_fr
                                  : p.ingredients_text_en || p.ingredients_text || p.ingredients_text_ar || p.ingredients_text_fr) || '';
        var name = (isAr() ? p.product_name_ar || p.product_name : p.product_name_en || p.product_name) || p.product_name_fr || '';
        var contains = tags(p.allergens_tags), may = tags(p.traces_tags);
        job.img = p.image_front_small_url || '';
        var data = cleanScan({
          readable: !!(texts.length || contains.length || may.length),
          product: [name, p.brands].filter(Boolean).join(' · '),
          ingredients_text: ingredients, check_text: texts.join('\n'), warnings_text: '', notes: '',
          contains: contains, may_contain: may

        // allergens even when the database entry has no allergen data.

          .filter(Boolean).filter(function (x, i, arr) { return arr.indexOf(x) === i; });

          r.found.forEach(function (f) { f.a.forEach(function (a) { clue(a, f.word + ' · ' + t('fromName')); }); });

  // Draws the card as a PNG so it can be saved or shared in chat apps.
  function cardImage(cfg) {
    var W = 1080, PAD = 64, FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif';

      });

    ['en', 'ar'].forEach(function (lg, idx) {

      if (idx) rows.push({ sep: true, h: 48 });
      function add(text, size, bold, indent) {
        var font = (bold ? '700 ' : '400 ') + size + 'px ' + FONT;
        wrap(text, font, W - PAD * 2 - (indent || 0), rtl).forEach(function (ln) { rows.push({ text: ln, font: font, rtl: rtl, indent: indent || 0, h: Math.round(size * 1.5) }); });

      add(c.intro, 38, false);
      c.items.forEach(function (i) { add('• ' + i, 38, true, 24); });
      add(c.care, 34, false);
      if (c.epi) add(c.epi, 34, true);
      add(c.thanks, 34, false);

    ctx.font = '800 50px ' + FONT; ctx.direction = 'ltr'; ctx.textAlign = 'left';
    ctx.fillText('⚠ ' + CARD_TEXT.en.title, PAD, HEAD / 2);
    ctx.direction = 'rtl'; ctx.textAlign = 'right';
    ctx.fillText(CARD_TEXT.ar.title, W - PAD, HEAD / 2);
    var y = HEAD + PAD;
    ctx.textBaseline = 'top';
    rows.forEach(function (r) {
      if (r.sep) {
        ctx.strokeStyle = '#d6cfc0'; ctx.lineWidth = 3; ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(PAD, y + r.h / 2); ctx.lineTo(W - PAD, y + r.h / 2); ctx.stroke(); ctx.setLineDash([]);
      } else if (r.text) {
        ctx.font = r.font; ctx.fillStyle = '#1f2a1f';
        ctx.direction = r.rtl ? 'rtl' : 'ltr'; ctx.textAlign = r.rtl ? 'right' : 'left';
        ctx.fillText(r.text, r.rtl ? W - PAD - r.indent : PAD + r.indent, y);
      }
      y += r.h;
    });
    ctx.font = '400 26px ' + FONT; ctx.fillStyle = '#6b705f'; ctx.direction = 'ltr'; ctx.textAlign = 'center';
    ctx.fillText('SafePlate · nightshiftgames123.github.io/safeplate', W / 2, H - 50);
    return new Promise(function (resolve) { cv.toBlob(resolve, 'image/png'); });
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }
  function copyText(text) {
    var done = function () { toast(t('cardCopied')); };
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done).catch(function () {});
  }

  function renderCard() {
    var cfg = cardCfg();
    view.innerHTML =
      '<h2>' + t('cardTitle') + '</h2>' +
      '<p class="muted" style="margin-top:0">' + t('cardIntro') + '</p>' +
      '<div class="card card-form">' +
        '<label for="card-name">' + t('cardName') + '</label>' +
        '<input type="text" id="card-name" maxlength="40" autocomplete="off" value="' + esc(cfg.name) + '"' + (curPerson() ? ' readonly' : '') + ' />' +
        '<label class="check-row"><input type="checkbox" id="card-severe"' + (cfg.severe ? ' checked' : '') + ' /> ' + t('cardSevere') + '</label>' +
        '<label class="check-row"><input type="checkbox" id="card-epi"' + (cfg.epi ? ' checked' : '') + ' /> ' + t('cardEpi') + '</label>' +
      '</div>' +
      '<div id="card-preview"></div>';
    function save() {
      cfg = { name: document.getElementById('card-name').value.trim(), severe: document.getElementById('card-severe').checked, epi: document.getElementById('card-epi').checked };
      var keep = cfg;
      if (curPerson()) { try { keep = { name: (JSON.parse(load('safeplate_card') || '{}') || {}).name || '', severe: cfg.severe, epi: cfg.epi }; } catch (e) {} }
      store('safeplate_card', JSON.stringify(keep));
      drawCard();
    }
    function drawCard() {
      var box = document.getElementById('card-preview');
      if (!sel.length) { box.innerHTML = '<div class="note">' + t('cardPick') + '</div>'; return; }
      box.innerHTML =
        '<div class="allergy-card" id="acard"><div class="ac-head"><span>⚠️ ' + CARD_TEXT.en.title + '</span><span lang="ar">' + CARD_TEXT.ar.title + '</span></div>' +
          cardBlockHtml(cfg, 'en') + '<div class="ac-sep"></div>' + cardBlockHtml(cfg, 'ar') + '</div>' +
        '<div class="row"><button class="btn" id="card-share">' + t('cardShare') + '</button>' +
        '<button class="btn ghost" id="card-save">' + t('cardSave') + '</button>' +
        '<button class="btn ghost" id="card-copy">' + t('cardCopy') + '</button></div>';
      document.getElementById('card-copy').addEventListener('click', function () { copyText(cardText(cfg)); });
      document.getElementById('card-save').addEventListener('click', function () {
        cardImage(cfg).then(function (blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = 'allergy-card.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        });
      });
      document.getElementById('card-share').addEventListener('click', function () {
        var text = cardText(cfg);
        cardImage(cfg).then(function (blob) {
          var file = blob && typeof File === 'function' ? new File([blob], 'allergy-card.png', { type: 'image/png' }) : null;
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], text: text });
          if (navigator.share) return navigator.share({ text: text });
          return copyText(text);
        }).catch(function () {});
      });
    }
    document.getElementById('card-name').addEventListener('input', save);
    document.getElementById('card-severe').addEventListener('change', save);
    document.getElementById('card-epi').addEventListener('change', save);
    drawCard();
  }

  function explainError(status, message, code) {
    var m = message || '';
    // Answers from SafePlate's own server carry a short code.
    if (code === 'daily_limit') return t('errDaily');
    if (code === 'busy_today') return t('errBusyToday');
    if (code === 'upstream' || code === 'not_configured') return t('errServer') + ' (' + status + ')';
    if (status === 400 && /api key/i.test(m)) return t('errKey');
    if (status === 403) return t('errForbidden');
    if (status === 429) return t('errRate');
    if (status >= 500) return t('errServer') + ' (' + status + ')';
    return 'Gemini ' + status + ': ' + m;
  }

  function send(text) {
    text = (text || '').trim();
    if (!text || aiBusy) return;
    if (!aiReady()) {
      drawChat(); showAiError(t('aiNeedKey'));
      var ki = document.getElementById('key-input'); if (ki) ki.focus();
      return;
    }
    chat.push({ role: 'user', text: text });
    var reply = { role: 'model', text: '' };
    chat.push(reply);
    aiBusy = true;
    if (location.hash === '#ai') renderAi(); // clears the box and the idea chips
    var box = document.getElementById('chat');
    if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ block: 'nearest' });

    var contents = chat.slice(0, -1).map(function (m) { return { role: m.role, parts: [{ text: m.text }] }; });
    var finish = null, blocked = null;
    // The server accepts a limited conversation; send the most recent turns, starting from a user message.
    var recent = chat.slice(0, -1).slice(-23);
    if (recent[0].role !== 'user') recent = recent.slice(1);
    aiFetch('chat', {
      systemInstruction: { parts: [{ text: systemPrompt() }] },
      contents: contents,
      generationConfig: { temperature: 0.5, maxOutputTokens: 4096 }
    }, {
      system: systemPrompt(),
      contents: recent.map(function (m) { return { role: m.role, text: m.text.slice(0, 6000) }; })
    }).then(function (res) {
      if (!res.ok) return res.json().catch(function () { return {}; }).then(function (d) { throw new Error(explainError(res.status, d.error && d.error.message, d.error && d.error.code)); });
      // Stream Server-Sent Events and render as text arrives.
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += decoder.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (line.indexOf('data:') !== 0) continue;
            var chunk;
            try { chunk = JSON.parse(line.slice(5)); } catch (e) { continue; }
            if (chunk.error) throw new Error(chunk.error.message || 'Gemini error');
            if (chunk.promptFeedback && chunk.promptFeedback.blockReason) blocked = chunk.promptFeedback.blockReason;
            var cand = chunk.candidates && chunk.candidates[0];
            if (cand && cand.finishReason) finish = cand.finishReason;
            ((cand && cand.content && cand.content.parts) || []).forEach(function (part) { if (part.text && !part.thought) reply.text += part.text; });
            drawChat();
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (blocked || !reply.text) throw new Error(t('errEmpty') + (blocked ? ' (' + blocked + ')' : finish ? ' (' + finish + ')' : ''));
      if (finish === 'MAX_TOKENS') reply.cut = true;
      aiBusy = false;
      if (location.hash === '#ai') renderAi();
    }).catch(function (err) {
      aiBusy = false;
      var msg = err instanceof TypeError ? t('errNetwork') : err.message;
      // A turn with no answer is dropped, so the conversation stays valid; the question goes back in the box.
      if (!reply.text) chat.splice(chat.length - 2, 2);
      if (location.hash !== '#ai') return;
      renderAi();
      showAiError(msg);
      var inp = document.getElementById('ai-input');
      if (inp && !reply.text) inp.value = text;
    });
  }

  // ---------------------------------------------------------------------------
  // Install: the browser's own install prompt where it exists (Android, desktop
  // Chrome and Edge, like Nasma AI); on iPhone and iPad, a short how-to instead.
  // ---------------------------------------------------------------------------
  var deferredInstall = null;
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function syncInstallBtn() {
    var b = document.getElementById('install-btn');
    b.textContent = t('installBtn');
    b.setAttribute('aria-label', t('installLabel')); b.title = t('installLabel');
    b.hidden = isStandalone() || !(deferredInstall || isIos());
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    syncInstallBtn();
  });
  window.addEventListener('appinstalled', function () { deferredInstall = null; syncInstallBtn(); });
  document.getElementById('install-btn').addEventListener('click', function () {
    if (deferredInstall) {
      var ev = deferredInstall;
      ev.prompt();
      (ev.userChoice || Promise.resolve()).then(function () { deferredInstall = null; syncInstallBtn(); });
    } else {
      document.getElementById('install-modal').classList.add('open');
    }
  });
  document.getElementById('install-modal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });

  // ---------------------------------------------------------------------------
  // Routing, theme, offline
  // ---------------------------------------------------------------------------
  // Shown at the top of the recipes list only, and not for 5 days after ✕.
  function syncKofi(h) {
    var until = +(load('safeplate_kofi_hide') || 0);
    // Cards hidden under the earlier 14-day rule come back within 5 days too.
    if (until > Date.now() + 5 * 864e5) { until = Date.now() + 5 * 864e5; store('safeplate_kofi_hide', String(until)); }
    document.getElementById('kofi').classList.toggle('ready', h === 'recipes' && Date.now() > until);
  }
  document.getElementById('kofi-x').addEventListener('click', function () {
    store('safeplate_kofi_hide', String(Date.now() + 5 * 864e5));
    document.getElementById('kofi').classList.remove('ready');
  });
  function route() {
    var h = location.hash.replace(/^#/, '') || 'recipes';
    syncKofi(h);
    var tab = h.indexOf('r/') === 0 ? 'recipes' : h;
    document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-tab') === tab); });
    if (h.indexOf('r/') === 0) renderRecipe(h.slice(2));
    else if (h === 'swaps') renderSwaps();
    else if (h === 'check') renderCheck();
    else if (h === 'ai') renderAi();
    else if (h === 'card') renderCard();
    else renderRecipes();
  }
  window.addEventListener('hashchange', function () { route(); if (location.hash.indexOf('#r/') !== 0) window.scrollTo(0, 0); });

  var themeBtn = document.getElementById('theme-btn');
  function syncThemeBtn() { themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
  themeBtn.addEventListener('click', function () {
    var th = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th);
    store('safeplate_theme', th);
    syncThemeBtn();
  });

  syncThemeBtn();
  renderChrome();
  route();
  openWelcome();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
</body>
